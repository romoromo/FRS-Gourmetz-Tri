<div>
  <header class="pageHeader">
    <h3>Carton Assets</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-8">
      <div class="form-group search-box">
        <search-box #searchbox (searchChange)="onSearchChanged($event)" (onEnter)="onSearch()" placeholder="{{'common.Search' | translate}}"></search-box>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="navbar action-box">
        <ul class="nav navbar-nav navbar-right">
          <li *ngIf="canManageCartonAssets" class="toolbaritem">
            <a href="javascript:;" (click)="newCartonAsset(row)">
              <i class="fa fa-plus-circle"></i> {{'common.New' | translate}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ngx-datatable class="material colored-header" #cartonAssetTable
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [externalPaging]="true"
                 [externalSorting]="true"
                 [count]="pagedResult.totalCount"
                 [limit]="pagedResult.filter.pageSize"
                 (page)="loadData($event)"
                 (sort)="loadData($event)">
  </ngx-datatable>

  <ng-template #flagTemplate let-row="row" let-value="value" let-i="index">
    <div class="text-center"><i [ngClass]="value ? 'fa fa-check-circle-o active': 'fa fa-circle-o'" aria-hidden="true"></i></div>
  </ng-template>


  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageCartonAssets" class="btn btn-link btn-xs" href="javascript:;" (click)="printCCLabel(row)"><i class="fa fa-print" aria-hidden="true"></i> Print Content Label</a>
    <a *ngIf="canManageCartonAssets" class="btn btn-link btn-xs" href="javascript:;" (click)="editCartonAsset(row)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'common.RowAction.Edit' | translate}}</a>
    <a *ngIf="!canManageCartonAssets" class="btn btn-link btn-xs" href="javascript:;" (click)="editCartonAsset(row)"><i class="fa fa-eye" aria-hidden="true"></i> {{'common.RowAction.Details' | translate}}</a>
    <a *ngIf="canManageCartonAssets" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteCartonAsset(row)"><i class="fa fa-trash-o" aria-hidden="true"></i> {{'common.RowAction.Delete' | translate}}</a>
  </ng-template>
</div>
