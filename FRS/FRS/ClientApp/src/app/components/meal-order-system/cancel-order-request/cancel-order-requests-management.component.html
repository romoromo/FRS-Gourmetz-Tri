<div>
  <header class="pageHeader" *ngIf="!isHideHeader">
    <h3>Cancel Order Requests</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-6">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'common.Search' | translate}}"></search-box>
      </div>
    </div>
    <div class="col-md-2">
      <mat-form-field floatLabel="always" class="filter">
        <mat-label>Filter by Status</mat-label>
        <mat-select [(ngModel)]="fStatusVal" name="fStatus" id="fStatus" #fStatus="ngModel" (selectionChange)="loadData()">
          <mat-option value="">ALL STATUSES</mat-option>
          <mat-option value="Approved">Approved</mat-option>
          <mat-option value="Rejected">Rejected</mat-option>
          <mat-option value="Submitted">Submitted</mat-option>

        </mat-select>
      </mat-form-field>
    </div>
    <!--<div class="col-sm-4">
    <div class="navbar action-box">
      <ul class="nav navbar-nav navbar-right">
        <li *ngIf="canManageCancelOrderRequests" class="toolbaritem">
          <a href="javascript:;" (click)="newCancelOrderRequest(row)">
            <i class="fa fa-plus-circle"></i> {{'common.New' | translate}}
          </a>
        </li>
      </ul>
    </div>
  </div>-->
  </div>

  <ngx-datatable class="material colored-header" #cancelOrderRequestsTable
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [externalPaging]="true"
                 [externalSorting]="true"
                 [count]="pagedResult.totalCount"
                 [limit]="pagedResult.filter.pageSize"
                 (page)="loadData($event)"
                 (sort)="loadData($event)">
  </ngx-datatable>

  <ng-template #flagTemplate let-row="row" let-value="value" let-i="index">
    <div class="text-center"><i [ngClass]="value ? 'fa fa-check-circle-o active': 'fa fa-circle-o'" aria-hidden="true"></i></div>
  </ng-template>


  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageCancelOrderRequests" class="btn btn-link btn-xs" href="javascript:;" (click)="approvalCancelOrderRequest(row)"><i class="fa fa-pencil-o" aria-hidden="true"></i> Approval </a>
    <!--<span *ngIf="canManageCancelOrderRequests && row.status != 'Submitted'" ><i class="fa fa-pencil-o" aria-hidden="true"></i> {{row.status}} </span>-->
  </ng-template>
</div>
