<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="dispenserOutletEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!dispenserCode.valid && showErrorAlert('Dispenser Code is required', 'Please enter code (minimum of 2 and maximum of 200 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <!--<mat-form-field class="col-xs-12">
            <mat-label>Outlet</mat-label>
            <mat-select [disabled]="!canManageClassLevels" id="outlet" name="outlet" [(ngModel)]="classLevelEdit.outletId" #outlet="ngModel" required>
              <mat-option *ngFor="let outlet of outlets" [value]="outlet.id">
                {{outlet.name}}
              </mat-option>
            </mat-select>
          </mat-form-field>-->
          <mat-form-field class="col-md-6">
            <input matInput autocomplete="off" [disabled]="!canManageClassLevels" type="text" id="dispenserCode" name="dispenserCode" placeholder="Enter code" [(ngModel)]="dispenserOutletEdit.dispenserCode" #dispenserCode="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput autocomplete="off" [disabled]="!canManageClassLevels" type="text" id="counterName" name="counterName" placeholder="Enter Name" [(ngModel)]="dispenserOutletEdit.counterName" #counterName="ngModel" maxlength="200" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput autocomplete="off" [disabled]="!canManageClassLevels" type="text" id="locationCode" name="locationCode" placeholder="Enter Location Code" [(ngModel)]="dispenserOutletEdit.locationCode" #locationCode="ngModel" minlength="2" maxlength="200" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput autocomplete="off" [disabled]="!canManageClassLevels" type="color" id="color" name="color" placeholder="Enter Color" [(ngModel)]="dispenserOutletEdit.color" #color="ngModel" minlength="2" maxlength="200" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput autocomplete="off" [disabled]="!canManageClassLevels" type="text" id="plcipAddress" name="plcipAddress" placeholder="Enter IP Address" [(ngModel)]="dispenserOutletEdit.plcipAddress" #plcipAddress="ngModel" minlength="2" maxlength="200" />
          </mat-form-field>
          <!--<mat-form-field class="col-md-12">-->
          <!--<input matInput autocomplete="off" [disabled]="!canManageClassLevels" type="text" id="PLCIPAddress" name="PLCIPAddress" placeholder="Enter IP Address" [(ngModel)]="dispenserOutletEdit.PLCIPAddress" #color="ngModel" minlength="2" maxlength="200" />-->
          <!--</mat-form-field>-->
          <mat-form-field class="col-md-6">
            <input matInput autocomplete="off" [disabled]="!canManageClassLevels" type="text" id="plcPort" name="plcPort" placeholder="Enter Port" [(ngModel)]="dispenserOutletEdit.plcPort" #plcPort="ngModel" minlength="2" maxlength="200" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput autocomplete="off" [disabled]="!canManageClassLevels" type="text" id="plcToken" name="plcToken" placeholder="Enter Token" [(ngModel)]="dispenserOutletEdit.plcToken" #plcToken="ngModel" minlength="2" maxlength="200" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput autocomplete="off" [disabled]="!canManageClassLevels" type="number" id="plcApiVer" name="plcApiVer" placeholder="Enter Api Version" [(ngModel)]="dispenserOutletEdit.plcApiVer" #plcApiVer="ngModel" maxlength="200" />
          </mat-form-field>
        </div>
      </div>
      <div style="min-height: 300px">
        <div style="min-height:300px">
          <button type="button" mat-button style="margin-top:20px" (click)="openDialogTrays()">
            <mat-icon>
              add
            </mat-icon> Add Trays
          </button>
          <table class="table table-sm table-bordered">
            <thead class="text-center">
              <tr>
                <td width="100px">tray_id</td>
                <td>IP Address</td>
                <td>Framework</td>
                <td>Motor Output Number</td>
                <td>LED Output Number</td>
                <td width="100px">Action</td>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let tray of dispenserOutletEdit.trays; let i = index" class="text-center">
                <td>{{ tray.trayId }}</td>
                <td>{{ tray.ipAddress }}</td>
                <td>{{ tray.framework }}</td>
                <td>{{ tray.motorOutputNumber }}</td>
                <td>{{ tray.ledOutputNumber }}</td>
                <td>
                  <button mat-button type="button" (click)="openDialogTrays(tray)"><mat-icon>edit</mat-icon></button>
                  <button mat-button type="button" (click)="deleteTray(tray)"><mat-icon>delete</mat-icon></button>                 
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageClassLevels" type="button" mat-button (click)="cancel()">{{'common.editor.Close' | translate}}</button>
      <button *ngIf="canManageClassLevels" type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'common.editor.Cancel' | translate}}</button>
      <button *ngIf="canManageClassLevels" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('common.editor.Saving' | translate) : ('common.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
