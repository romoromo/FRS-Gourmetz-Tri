<div>
  <header class="pageHeader">
    <h3>Caterers</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-8">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'common.Search' | translate}}"></search-box>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="navbar action-box">
        <ul class="nav navbar-nav navbar-right">
          <li *ngIf="canManageCatererInfos" class="toolbaritem">
            <a href="javascript:;" (click)="newCatererInfo(row)">
              <i class="fa fa-plus-circle"></i> {{'common.New' | translate}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ngx-datatable #infotable class="material colored-header"
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [externalPaging]="true"
                 [externalSorting]="true"
                 [count]="pagedResult.totalCount"
                 [offset]="pagedResult.filter.pageNumber"
                 [limit]="pagedResult.filter.pageSize"
                 (page)="loadData($event)"
                 (sort)="loadData($event)">
    <!-- Row Detail Template -->
    <ngx-datatable-row-detail [rowHeight]="'100%'" #myDetailRow (toggle)="onDetailToggle($event)">
      <ng-template let-row="row" let-expanded="expanded" ngx-datatable-row-detail-template>
        <div style="padding-left:25px;min-height:300px" >
          <h4>{{row.name}} Details</h4>
          <mat-tab-group dynamicHeight>
            <mat-tab label="Outlet Profiles" *ngIf="canViewOutletProfiles">
              <div class="container-fluid" style="padding-top:20px">
                <outlet-profiles-management #outletProfileTab [isHideHeader]="true" [catererId]="row.id"></outlet-profiles-management>
              </div>

            </mat-tab>
            <mat-tab label="Meal Types" *ngIf="canViewMealTypes">
              <div class="container-fluid" style="padding-top:20px">
                <meal-types-management [isHideHeader]="true" [catererId]="row.id"></meal-types-management>
              </div>
            </mat-tab>
            <mat-tab label="Meal Periods" *ngIf="canViewMealPeriods">
              <div class="container-fluid" style="padding-top:20px">
                <meal-periods-management [isHideHeader]="true" [catererId]="row.id"></meal-periods-management>
              </div>
            </mat-tab>
            <mat-tab label="Dish Types" *ngIf="canViewDishTypes">
              <div class="container-fluid" style="padding-top:20px">
                <dish-types-management [isHideHeader]="true" [catererId]="row.id"></dish-types-management>
              </div>
            </mat-tab>
            <mat-tab label="Cuisines" *ngIf="canViewDishes">
              <div class="container-fluid" style="padding-top:20px">
                <cuisines-management [isHideHeader]="true" [catererId]="row.id"></cuisines-management>
              </div>
            </mat-tab>
              <mat-tab label="Products" *ngIf="canViewDishes">
                <div class="container-fluid" style="padding-top:20px">
                  <dishes-management [isHideHeader]="true" [catererId]="row.id"></dishes-management>
                </div>
              </mat-tab>
              <mat-tab label="Dish Cycles" *ngIf="canViewDishCycles">
                <div class="container-fluid" style="padding-top:20px">
                  <dish-cycles-management [isHideHeader]="true" [catererId]="row.id"></dish-cycles-management>
                </div>
              </mat-tab>
              <!--<mat-tab label="Menus">
      <div class="container-fluid" style="padding-top:20px">
        <menus-management [isHideHeader]="true" [catererId]="row.id"></menus-management>
      </div>
    </mat-tab>
    <mat-tab label="Menu Cycles">
      <div class="container-fluid" style="padding-top:20px">
        <menu-cycles-management [isHideHeader]="true" [catererId]="row.id"></menu-cycles-management>
      </div>
    </mat-tab>-->
          </mat-tab-group>
        </div>
      </ng-template>
    </ngx-datatable-row-detail>

  </ngx-datatable>

  <ng-template #flagTemplate let-row="row" let-value="value" let-i="index">
    <div class="text-center"><i [ngClass]="value ? 'fa fa-check-circle-o active': 'fa fa-circle-o'" aria-hidden="true"></i></div>
  </ng-template>


  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageCatererInfos" class="btn btn-link btn-xs" href="javascript:;" (click)="editCatererInfo(row)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'common.RowAction.Edit' | translate}}</a>
    <a *ngIf="canViewCatererInfos && !canManageCatererInfos" class="btn btn-link btn-xs" href="javascript:;" (click)="editCatererInfo(row)"><i class="fa fa-eye" aria-hidden="true"></i> View </a>
    <a *ngIf="canViewCatererInfos" class="btn btn-link btn-xs" href="javascript:;" (click)="toggleExpandRow(row)">Details</a>
    <!--<a *ngIf="canManageCatererInfos" class="btn btn-link btn-xs" href="javascript:;" (click)="openCalendar(row)"><i class="fa" aria-hidden="true"></i> Calendar</a>-->
    <a *ngIf="canViewDishCalendar" class="btn btn-link btn-xs" href="javascript:;" (click)="openDishCalendar(row)"><i class="fa" aria-hidden="true"></i> Dish Calendar</a>
    <a *ngIf="canManageCatererOutlets" class="btn btn-link btn-xs" href="javascript:;" (click)="approveOutlet(row)"><i aria-hidden="true"></i> Outlets</a>

    <a *ngIf="canManageCatererInfos" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteCatererInfo(row)"><i class="fa fa-trash-o" aria-hidden="true"></i> {{'common.RowAction.Delete' | translate}}</a>
  </ng-template>
</div>
