<div>
  <header class="pageHeader" *ngIf="!isHideHeader">
    <h3>Dishes</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-8">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'common.Search' | translate}}"></search-box>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="navbar action-box">
        <ul class="nav navbar-nav navbar-right">
          <li *ngIf="canManageDishes" class="toolbaritem">
            <a href="javascript:;" (click)="exportData()" *ngIf="!isExporting">
              <i class="fa fa-download"></i> Export
            </a>
            <a href="javascript:;" *ngIf="isExporting">
              <i class="fa fa-circle-o-notch fa-spin"></i> Exporting
            </a>
          </li>
          <li *ngIf="canManageDishes" class="toolbaritem">
            <a href="javascript:;" (click)="onImportClick(fileImport)" *ngIf="!isImporting">
              <i class="fa fa-upload"></i> Import
            </a>
            <a href="javascript:;" *ngIf="isImporting">
              <i class="fa fa-circle-o-notch fa-spin"></i> Importing
            </a>
          </li>
          <li *ngIf="canManageDishes" class="toolbaritem">
            <a href="javascript:;" (click)="newDish(row)">
              <i class="fa fa-plus-circle"></i> {{'common.New' | translate}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ngx-datatable class="material colored-header" #dishesTable [loadingIndicator]="loadingIndicator" [rows]="rows"
    [rowHeight]="'auto'" [headerHeight]="'auto'" [footerHeight]="35" [columns]="columns" [columnMode]="'force'"
    [externalPaging]="true" [externalSorting]="true" [count]="pagedResult.totalCount"
    [limit]="pagedResult.filter.pageSize" (page)="loadData($event)" (sort)="loadData($event)">
  </ngx-datatable>

  <ng-template #flagTemplate let-row="row" let-value="value" let-i="index">
    <div class="text-center"><i [ngClass]="value ? 'fa fa-check-circle-o active': 'fa fa-circle-o'"
        aria-hidden="true"></i></div>
  </ng-template>


  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a class="btn btn-link btn-xs" href="javascript:;" (click)="previewImage(row)"><i
        class="fa fa-eye" aria-hidden="true"></i> Preview</a>
    <a *ngIf="canManageDishes" class="btn btn-link btn-xs" href="javascript:;" (click)="editDish(row)"><i
        class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'common.RowAction.Edit' | translate}}</a>
    <a *ngIf="canManageDishes" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteDish(row)"><i
        class="fa fa-trash-o" aria-hidden="true"></i> {{'common.RowAction.Delete' | translate}}</a>
  </ng-template>
</div>

<input type="file" #fileImport placeholder="Choose file" (change)="importedFile(fileImport.files)"
  style="display:none;">
