<div>
  <h1 mat-dialog-title>{{data.header}}</h1>
  <div mat-dialog-content>
    <div class="form-group search-box">
      <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'common.Search' | translate}}"></search-box>
    </div>
    <mat-label>Class Filter:</mat-label>
    <mat-select id="cl" name="cl" (selectionChange)="onClassChanged($event)" [(ngModel)]="filterClassId" #cl="ngModel">
      <mat-option *ngFor="let c of classes" [value]="c.id">
        {{c.name}}
      </mat-option>
    </mat-select>
    <mat-label>Interest Group Filter:</mat-label>
    <mat-select id="ig" name="ig" (selectionChange)="onGroupChanged($event)" [(ngModel)]="filterIGId" #ig="ngModel">
      <mat-option *ngFor="let ig of interestGroups" [value]="ig.id">
        {{ig.name}}
      </mat-option>
    </mat-select>
    <mat-label>is FAS Filter:</mat-label>
    <mat-radio-group id="fas" name="fas" name="FAS Student" (change)="onFASChange($event)" [(ngModel)]="filterIsFas" #fas="ngModel">
      <mat-radio-button [value]="true">Yes</mat-radio-button>&nbsp;
      <mat-radio-button [value]="false">No</mat-radio-button>&nbsp;
    </mat-radio-group>
    <button type="button" mat-button (click)="clearFilter()">Clear Filters</button>

    <ngx-datatable class="material colored-header"
                   [loadingIndicator]="loadingIndicator"
                   [rows]="rows"
                   [rowHeight]="'auto'"
                   [headerHeight]="'auto'"
                   [footerHeight]="35"
                   [columns]="columns"
                   [columnMode]="'force'"
                   [externalPaging]="true"
                   [externalSorting]="true"
                   [count]="pagedResult.totalCount"
                   [offset]="pagedResult.filter.page"
                   [limit]="pagedResult.filter.pageSize"
                   (page)="loadData($event)"
                   (sort)="loadData($event)">
    </ngx-datatable>

    <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
      <a class="example-section btn btn-link btn-xs" style="cursor:pointer">
        <mat-checkbox [(ngModel)]="row.checked"></mat-checkbox>
      </a>
    </ng-template>

    <ng-template #fasTemplate let-row="row" let-value="value" let-i="index">
      {{(row.isFAS ? 'YES' : 'NO')}}
    </ng-template>
  </div>

  <div mat-dialog-actions align="center">
    <button type="button" mat-button (click)="cancel()"><i class='fa fa-times'></i>{{'reservations.editor.Cancel' | translate}}</button>
    <button type="button" mat-button cdkFocusInitial (click)="save()">
      <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> Choose
    </button>
  </div>
</div>
