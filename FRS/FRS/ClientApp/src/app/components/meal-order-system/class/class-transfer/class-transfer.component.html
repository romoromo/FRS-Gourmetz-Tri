<h1 mat-dialog-title>Transfer Class</h1>
<div>
    <form class="form-horizontal" name="classEditorForm" #f="ngForm" novalidate>
        <div mat-dialog-content>
            <div class="row" style="display: flex; gap: 5px;flex-direction: column">
                <div class="col-sm-12">
                    <p class="col-sm-12">Origin Class : {{originClassName}}</p>
                </div>
                <div class="col-sm-12">
                    <p class="col-sm-12">To</p>
                </div>
                <div class="col-sm-12">
                    <mat-form-field class="col-md-12">
                        <mat-label>Batch</mat-label>
                        <mat-select [disabled]="!canManageClasses || loadingInitialFormData" id="batchId" name="batchId"
                            ngModel required #batchId="ngModel">
                            <mat-option *ngFor="let c of batches" [value]="c.id">
                                {{c.name}}
                            </mat-option>
                        </mat-select>
                        <mat-error *ngIf="showValidationErrors && f.submitted">Batch is required</mat-error>
                    </mat-form-field>
                </div>
                <div class="col-sm-12">
                    <mat-form-field class="col-sm-12">
                        <mat-label>Class Level</mat-label>
                        <mat-select [disabled]="!canManageClasses || loadingInitialFormData" id="classLevelId"
                            name="classLevelId" ngModel #classLevelId="ngModel" required
                            (selectionChange)="onClassLevelChange($event)">
                            <mat-option *ngFor="let classLevel of classLevels" [value]="classLevel.id">
                                {{classLevel.name}}
                            </mat-option>
                        </mat-select>
                        <mat-error *ngIf="showValidationErrors && f.submitted">Class Level is required</mat-error>
                    </mat-form-field>
                </div>
                <div class="col-sm-12">
                    <mat-form-field class="col-md-12">
                        <mat-label>Class</mat-label>
                        <mat-select [disabled]="!canManageClasses || loadingInitialFormData" id="classId" name="classId"
                            ngModel required #classId="ngModel">
                            <mat-option *ngFor="let c of classes" [value]="c.id">
                                {{c.name}}
                            </mat-option>
                        </mat-select>
                        <mat-error *ngIf="showValidationErrors && f.submitted">Class is required</mat-error>
                    </mat-form-field>
                </div>
            </div>

            <div class="clearfix"></div>
        </div>
    </form>
    <div mat-dialog-actions class="bottom-action">
        <button mat-button (click)="cancel()"><i class='fa fa-times'></i> {{'common.editor.Cancel' |
            translate}}</button>
        <button *ngIf="canManageClasses" (click)="onSave()" mat-button [disabled]="!f.form.valid || isSaving">
            <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i>
            {{isSaving ? 'Transferring..' : 'Transfer'}}
        </button>
    </div>
</div>
