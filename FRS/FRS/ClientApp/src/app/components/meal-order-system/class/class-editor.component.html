<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="classEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() : invalidate()">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-md-12">
            <mat-label>Class Level</mat-label>
            <mat-select [disabled]="!canManageClasses" id="classLevel" name="classLevel" [(ngModel)]="classEdit.classLevelId" #classLevel="ngModel" required>
              <mat-option *ngFor="let classLevel of classLevels" [value]="classLevel.id">
                {{classLevel.name}}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="showValidationErrors && f.submitted">Class Level is required</mat-error>
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <input matInput autocomplete="off" [disabled]="!canManageClasses" type="text" id="className" name="className" placeholder="Enter name" [(ngModel)]="classEdit.name" #className="ngModel" required minlength="2" maxlength="200" />
            <mat-error *ngIf="showValidationErrors && f.submitted">Name is required</mat-error>
          </mat-form-field>

          <div>
            <button type="button" mat-button style="margin-top:20px" (click)="openAddDetailDialog()">
              <mat-icon>
                add
              </mat-icon> Add Session Period
            </button>
            <table class="table table-bordered mt-3">
              <thead>
                <tr>
                  <th>Meal Period</th>
                  <th>Session</th>
                  <th style="width: 100px;">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let d of classEdit.detail">
                  <td>{{ d.periodName }}</td>
                  <td>{{ d.sessionName }}</td>
                  <td>
                    <a class="btn btn-link btn-xs" href="javascript:;"
                      (click)="removeDetail(d)"><i class="fa fa-trash-o" aria-hidden="true"></i>
                      {{'common.RowAction.Delete' | translate}}</a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageClasses" type="button" mat-button (click)="cancel()" >{{'common.editor.Close' | translate}}</button>
      <button *ngIf="canManageClasses" type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'common.editor.Cancel' | translate}}</button>
      <button *ngIf="canManageClasses" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('common.editor.Saving' | translate) : ('common.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
