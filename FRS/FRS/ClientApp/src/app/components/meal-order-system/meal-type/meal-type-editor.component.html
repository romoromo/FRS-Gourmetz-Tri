<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="mealTypeEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!mealTypeCode.valid && showErrorAlert('Code is required', 'Please enter name (minimum of 2 and maximum of 200 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <mat-form-field class="col-md-12">
          <input matInput autocomplete="off" [disabled]="!canManageMealTypes" type="text" id="mealTypeName" name="mealTypeName" placeholder="Enter name" [(ngModel)]="mealTypeEdit.name" #mealTypeName="ngModel" required minlength="2" maxlength="200" />
        </mat-form-field>
        <mat-form-field class="col-md-12">
          <input matInput autocomplete="off" [disabled]="!canManageMealTypes" type="text" id="mealTypePrice" name="mealTypePrice" placeholder="Enter price" [(ngModel)]="mealTypeEdit.price" #mealTypePrice="ngModel" />
        </mat-form-field>
        <mat-form-field floatPlaceholder="always" class="mat-form-field--no-underline col-md-12" style="padding-left: 15px !important;">
          <input matInput placeholder="Charges based on" style="display: none" [disabled]="!canManageMealTypes">
          <mat-radio-group name="ChargeType" [(ngModel)]="mealTypeEdit.chargeType" [disabled]="!canManageMealTypes">
            <mat-radio-button value="sku">SKU</mat-radio-button>&nbsp;
            <mat-radio-button value="mealtype">Meal Type</mat-radio-button>&nbsp;
          </mat-radio-group>
          <mat-checkbox [(ngModel)]="mealTypeEdit.isSubMenu" id="isSubMenu"
                        name="isSubMenu">
            <label style="margin: 3px 8px auto 0;color: rgba(0,0,0,.54);font-weight: 500;font-size: smaller;">Sub Menus</label>
          </mat-checkbox>
        </mat-form-field>
        <!--<mat-form-field class="col-xs-12">
          <mat-label>Cuisine</mat-label>
          <mat-select [disabled]="!canManageMealTypes" id="cuisine" name="cuisine" [(ngModel)]="mealTypeEdit.cuisineId" #cuisine="ngModel">
            <mat-option *ngFor="let cuisine of cuisines" [value]="cuisine.id">
              {{cuisine.name}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <mat-label class="col-md-12"><h5>Dishes</h5></mat-label>
        <div *ngFor="let dish of dishes; let i=index" class="col-md-6">
          <mat-checkbox class="col-sm-6 col-xs-12" [(ngModel)]="dish.checked" id="dish-{{i}}"
                        name="dish-{{i}}">
            <label style="margin: 3px 8px auto 0;color: rgba(0,0,0,.54);font-weight: 500;font-size: smaller;">{{dish.label}}</label>
          </mat-checkbox>
        </div>-->
      </div>
      
      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageMealTypes" type="button" mat-button (click)="cancel()" >{{'common.editor.Close' | translate}}</button>
      <button *ngIf="canManageMealTypes" type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'common.editor.Cancel' | translate}}</button>
      <button *ngIf="canManageMealTypes" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('common.editor.Saving' | translate) : ('common.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
