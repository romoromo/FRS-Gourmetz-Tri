<div>
  <header class="pageHeader">
    <h3>Meal Allocations</h3>
  </header>
  <div class="row control-box">
    <div class="col-xs-12 col-sm-4">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'common.Search' | translate}}"></search-box>
      </div>
    </div>
    <div class="col-xs-6 col-sm-4 col-md-2">
      <mat-form-field>
        <input matInput [matDatepicker]="startpicker" placeholder="Delivery Date" [value]="start"
               (dateChange)="onChangeDate('start', $event)">
        <mat-datepicker-toggle matSuffix [for]="startpicker"></mat-datepicker-toggle>
        <mat-datepicker #startpicker></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col-xs-6 col-sm-4 col-md-2">
      <div class="navbar action-box">
        <ul class="nav navbar-nav navbar-right">
          <li *ngIf="canManageMealAllocations" class="toolbaritem">
            <a href="javascript:;" (click)="newAllocation(row)">
              <i class="fa fa-plus-circle"></i> {{'common.New' | translate}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ngx-datatable class="material my-custom-header-table"
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [externalPaging]="true"
                 [externalSorting]="true"
                 [count]="pagedResult.totalCount"
                 [offset]="pagedResult.filter.pageNumber"
                 [limit]="pagedResult.filter.pageSize"
                 (page)="loadData($event)"
                 (sort)="loadData($event)">
  </ngx-datatable>

  <ng-template #iconTemplate let-row="row" let-value="value" let-i="index">
    <div *ngIf="row.filePath">
      <img [src]="getFileImage(row.filePath)" alt="icon" style="width:50px; height:50px;" />
    </div>
  </ng-template>

  <ng-template #fasTemplate let-row="row" let-value="value" let-i="index">
    {{(row.isFAS ? 'YES' : 'NO')}}
  </ng-template>

  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageMealAllocations" class="btn btn-link btn-xs" href="javascript:;" (click)="editAllocation(row)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'common.RowAction.Edit' | translate}}</a>
    <a *ngIf="!canManageMealAllocations" class="btn btn-link btn-xs" href="javascript:;" (click)="editAllocation(row)"><i class="fa fa-eye" aria-hidden="true"></i> {{'common.RowAction.Details' | translate}}</a>
    <a *ngIf="canManageMealAllocations" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteAllocation(row)"><i class="fa fa-trash-o" aria-hidden="true"></i> {{'common.RowAction.Delete' | translate}}</a>
  </ng-template>
</div>
