<h1 mat-dialog-title>{{ data.header }}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="classLevelEditorForm" #f="ngForm" novalidate (ngSubmit)="
      f.form.valid
        ? save()
        : !classLevelName.valid &&
          showErrorAlert(
            'Name is required',
            'Please enter name (minimum of 2 and maximum of 200 characters)'
          )
    ">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-md-12">
            <input matInput autocomplete="off" [disabled]="!canManageClassLevels" type="text" id="classLevelName"
              name="classLevelName" placeholder="Enter name" [(ngModel)]="classLevelEdit.name" #classLevelName="ngModel"
              required minlength="2" maxlength="200" />
          </mat-form-field>
        </div>
      </div>

      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageClassLevels" type="button" mat-button (click)="cancel()">
        {{ "common.editor.Close" | translate }}
      </button>
      <button *ngIf="canManageClassLevels" type="button" mat-button (click)="cancel()" [disabled]="isSaving">
        <i class="fa fa-times"></i> {{ "common.editor.Cancel" | translate }}
      </button>
      <button *ngIf="canManageClassLevels" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class="fa fa-save"></i><i *ngIf="isSaving" class="fa fa-circle-o-notch fa-spin"></i>
        {{
        isSaving
        ? ("common.editor.Saving" | translate)
        : ("common.editor.Save" | translate)
        }}
      </button>
    </div>
  </form>
</div>
