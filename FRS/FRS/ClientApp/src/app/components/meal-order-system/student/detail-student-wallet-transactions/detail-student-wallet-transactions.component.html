<h2 mat-dialog-title>Detail Student Wallet Transactions</h2>

<mat-dialog-content>
    <div class="row control-box">
    <div class="col-sm-8">
      <div class="form-group search-box">
        <search-box #searchbox (searchChange)="onSearchChanged($event)" (onEnter)="onSearch()" placeholder="{{'common.Search' | translate}}"></search-box>
      </div>
    </div>    
  </div>

  <ngx-datatable class="material colored-header" #transactionTable
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [externalPaging]="true"
                 [externalSorting]="true"
                 [count]="pagedResult.totalCount"
                 [limit]="pagedResult.filter.pageSize"
                 (page)="loadData($event)"
                 (sort)="loadData($event)">
  </ngx-datatable>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button type="button" mat-button (click)="close()" [disabled]="isSaving"><i class='fa fa-times'></i>
        Close</button>
    <button type="button" (click)="save()" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-download'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i>
        {{isSaving ? 'Downloading' : 'Download'}}
    </button>
</mat-dialog-actions>
