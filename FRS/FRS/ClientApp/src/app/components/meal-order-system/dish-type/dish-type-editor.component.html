<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="dishTypeEditorForm" #f="ngForm" novalidate
        (ngSubmit)="save(f)">
    <div mat-dialog-content>
      <div class="row">
        <mat-label class="col-md-12"><h5>General Information</h5></mat-label>
        <mat-form-field class="col-md-12">
          <input matInput autocomplete="off" [disabled]="!canManageDishTypes" type="text" id="dishTypeName" name="dishTypeName" placeholder="Enter name" [(ngModel)]="dishTypeEdit.name" #dishTypeName="ngModel" required minlength="2" maxlength="200" />
        </mat-form-field>
        <mat-form-field class="col-md-12">
          <input matInput autocomplete="off" [disabled]="!canManageDishTypes" type="number" id="orderNumber" name="orderNumber" placeholder="Enter Order number" [(ngModel)]="dishTypeEdit.orderNumber" #dishTypeOrderNumber="ngModel" required />
        </mat-form-field>
        <!--<mat-label class="col-md-12"><h5>Meal Period</h5></mat-label>
        <div *ngFor="let period of periods; let i=index" class="col-md-6">
          <mat-checkbox class="col-sm-6 col-xs-12" [(ngModel)]="period.checked" id="period-{{i}}"
                        name="period-{{i}}">
            <label style="margin: 3px 8px auto 0;color: rgba(0,0,0,.54);font-weight: 500;font-size: smaller;">{{period.name}}</label>
          </mat-checkbox>
        </div>-->
      </div>

      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageDishTypes" type="button" mat-button (click)="cancel()" >{{'common.editor.Close' | translate}}</button>
      <button *ngIf="canManageDishTypes" type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'common.editor.Cancel' | translate}}</button>
      <button *ngIf="canManageDishTypes" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('common.editor.Saving' | translate) : ('common.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
