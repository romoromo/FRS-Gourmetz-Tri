<h1 mat-dialog-title style="overflow-wrap: anywhere;">{{data.header}} for {{dishCycle.label}} {{day > 0 ? '(Day ' + day + ')' : ''}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="viewDishEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!dishCycleLabel.valid && showErrorAlert('Label is required', 'Please enter label (minimum of 2 and maximum of 200 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <mat-tab-group>
          <mat-tab [label]="period.mealPeriodName" *ngFor="let period of dishCycle.dishCyclePeriods; let x=index" class="tab-title">
            <div *ngFor="let set of period.sets; let x=index" class="col-xs-12">
              <table class="table table-sm table-condensed table-bordered" style="margin-top: 10px">
                <thead>
                  <tr>
                    <th colspan="3" class="text-center">{{(set.cycleTypeLabel ? set.cycleTypeLabel : set.label)}}</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let menu of set.menus; let y=index">
                    <td>
                      <mat-checkbox id="dish-{{period.mealPeriodId}}{{set.id}}{{menu.dishId}}{{x}}{{y}}" name="dish-{{period.mealPeriodId}}{{set.id}}{{menu.dishId}}{{x}}{{y}}" [(ngModel)]="menu.checked" (change)="selectMenu(menuDish, menu)">
                      </mat-checkbox>
                    </td>
                    <td>
                      {{menu.dishLabel}}
                    </td>
                    <td>
                      {{menu.dishCode}}
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </mat-tab>
        </mat-tab-group>
      </div>

      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button type="button" mat-button (click)="cancel()">{{'common.editor.Close' | translate}}</button>
      <button type="submit" mat-button [disabled]="isSaving" *ngIf="day > 0">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('common.editor.Saving' | translate) : ('common.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
