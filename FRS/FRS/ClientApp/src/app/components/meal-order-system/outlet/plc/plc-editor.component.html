<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="plcEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!ipAddress.valid && showErrorAlert('IP Addresss is required', 'Please enter code (minimum of 2 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-md-12">
            <input matInput autocomplete="off"  type="text" id="ipAddress" name="ipAddress" placeholder="Enter IP Address" [(ngModel)]="plcEdit.ipAddress" ipAddress="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <input matInput autocomplete="off"  type="text" id="framework" name="framework" placeholder="Framework" [(ngModel)]="plcEdit.framework" #framework="ngModel" maxlength="200" />
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <input matInput autocomplete="off"  type="number" id="totalNumber" name="totalNumber" placeholder="Output Total Number" [(ngModel)]="plcEdit.totalNumber" #outputTotalNumber="ngModel" maxlength="200" />
          </mat-form-field>
        </div>
      </div>

      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button  type="button" mat-button (click)="cancel()">{{'common.editor.Close' | translate}}</button>
      <button type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'common.editor.Cancel' | translate}}</button>
      <button type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('common.editor.Saving' | translate) : ('common.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
