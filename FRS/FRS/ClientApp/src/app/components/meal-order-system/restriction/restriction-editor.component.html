<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="restrictionEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() : invalidate()">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-md-12">
            <mat-label>Restriction Type</mat-label>
            <mat-select [disabled]="!canManageRestrictions" id="restrictionType" name="restrictionType" [(ngModel)]="restrictionEdit.restrictionTypeId" #restrictionType="ngModel" required>
              <mat-option *ngFor="let restrictionType of restrictionTypes" [value]="restrictionType.id">
                {{restrictionType.label}}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="showValidationErrors && f.submitted">Restriction Type is required</mat-error>
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <input matInput autocomplete="off" [disabled]="!canManageRestrictions" type="text" id="restrictionCode" name="restrictionCode" placeholder="Enter code" [(ngModel)]="restrictionEdit.code" #restrictionCode="ngModel" required minlength="2" maxlength="200" />
            <mat-error *ngIf="showValidationErrors && f.submitted">Code is required</mat-error>
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <input matInput autocomplete="off" [disabled]="!canManageRestrictions" type="text" id="restrictionLabel" name="restrictionLabel" placeholder="Enter label" [(ngModel)]="restrictionEdit.label" #restrictionLabel="ngModel" required minlength="2" maxlength="200" />
            <mat-error *ngIf="showValidationErrors && f.submitted">Label is required</mat-error>
          </mat-form-field>
          <mat-form-field floatPlaceholder="always" class="mat-form-field--no-underline col-md-6 col-xs-12" style="padding-left: 15px !important;">
            <input matInput placeholder="Set Patient as High Priority" style="display: none">
            <mat-radio-group name="isHighPriority" [(ngModel)]="restrictionEdit.isHighPriority" [disabled]="!canManageRestrictions">
              <mat-radio-button [value]="true">Yes</mat-radio-button>
              <mat-radio-button [value]="false">No</mat-radio-button>
            </mat-radio-group>
          </mat-form-field>
          <mat-form-field floatPlaceholder="always" class="mat-form-field--no-underline col-md-6 col-xs-12" style="padding-left: 15px !important;">
            <input matInput placeholder="Include in High Priority Filtering" style="display: none">
            <mat-radio-group name="isIncludeHighPriorityFiltering" [(ngModel)]="restrictionEdit.isIncludeHighPriorityFiltering" [disabled]="!canManageRestrictions">
              <mat-radio-button [value]="true">Yes</mat-radio-button>
              <mat-radio-button [value]="false">No</mat-radio-button>
            </mat-radio-group>
          </mat-form-field>
          <mat-form-field floatPlaceholder="always" class="mat-form-field--no-underline col-md-6 col-xs-12" style="padding-left: 15px !important;">
            <input matInput placeholder="Available as Date-Specific" style="display: none">
            <mat-radio-group name="isAvailableDateSpecific" [(ngModel)]="restrictionEdit.isAvailableDateSpecific" [disabled]="!canManageRestrictions">
              <mat-radio-button [value]="true">Yes</mat-radio-button>
              <mat-radio-button [value]="false">No</mat-radio-button>
            </mat-radio-group>
          </mat-form-field>
          <mat-form-field floatPlaceholder="always" class="mat-form-field--no-underline col-md-6 col-xs-12" style="padding-left: 15px !important;">
            <input matInput placeholder="Date-Specific Single Meal Period Only" style="display: none">
            <mat-radio-group name="isMealFiltering" [(ngModel)]="restrictionEdit.isMealFiltering" [disabled]="!canManageRestrictions">
              <mat-radio-button [value]="true">Yes</mat-radio-button>
              <mat-radio-button [value]="false">No</mat-radio-button>
            </mat-radio-group>
          </mat-form-field>
          <mat-form-field class="col-md-4">
            <input matInput autocomplete="off" [disabled]="!canManageRestrictions" type="number" id="restrictionSequence" name="restrictionSequence" placeholder="Sequence" [(ngModel)]="restrictionEdit.sequence" #restrictionSequence="ngModel" required min="0" />
          </mat-form-field>
        </div>
      </div>

      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageRestrictions" type="button" mat-button (click)="cancel()" >{{'common.editor.Close' | translate}}</button>
      <button *ngIf="canManageRestrictions" type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'common.editor.Cancel' | translate}}</button>
      <button *ngIf="canManageRestrictions" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('common.editor.Saving' | translate) : ('common.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
