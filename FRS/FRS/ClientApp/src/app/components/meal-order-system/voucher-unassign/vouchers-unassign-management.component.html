<div>
  <header class="pageHeader" *ngIf="!isHideHeader">
    <h3>Vouchers Unassign</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-8">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" (onEnter)="onSearchTriggered()"
          placeholder="{{'common.Search' | translate}}"></search-box>
      </div>
    </div>
  </div>
  <ngx-datatable class="material colored-header" #vouchersTable [loadingIndicator]="loadingIndicator" [rows]="rows"
    [rowHeight]="'auto'" [headerHeight]="'auto'" [footerHeight]="35" [columns]="columns" [columnMode]="'force'"
    [externalPaging]="true" [externalSorting]="true" [count]="pagedResult.totalCount"
    [limit]="pagedResult.filter.pageSize" (page)="loadData($event)" (sort)="loadData($event)">
  </ngx-datatable>

  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageVouchers && row?.status == 'NEW'" class="btn btn-link btn-xs" href="javascript:;" (click)="unAssignVoucher(row)"><i
        class="fa fa-unlink" aria-hidden="true"></i> Un-Assign</a>
  </ng-template>
</div>
