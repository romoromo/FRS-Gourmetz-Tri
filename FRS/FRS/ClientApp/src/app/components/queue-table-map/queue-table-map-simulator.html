<h1 mat-dialog-title>Simulator</h1>



<div mat-dialog-content>
  
  <div *ngIf="!token" class="col-md-6">
    <div class="col-md-12">Need Token To Call Queue</div>
    <mat-form-field appearance="fill" class="col-md-12">
      <mat-label>Username</mat-label>
      <input matInput [(ngModel)]="username">
    </mat-form-field>
    <mat-form-field appearance="fill" class="col-md-12">
      <mat-label>Password</mat-label>
      <input matInput [(ngModel)]="password">
    </mat-form-field>
    <button class="col-md-12" (click)="getToken(username, password)" mat-button>Get Token</button>
  </div>
  <div *ngIf="token">
    <!--<div class="col-md-12">Token valid until {{expire}} <button class="btn btn-danger" (click)="token = null" mat-button>Clear token</button></div>-->
    <div class="col-md-6">
      <mat-form-field appearance="fill" class="col-md-12" *ngIf="false">
        <mat-label>Intitutionid</mat-label>
        <input matInput [(ngModel)]="data.Intitutionid">
      </mat-form-field>
      <mat-form-field appearance="fill" class="col-md-12">
        <mat-label>Station Id/Queue Id</mat-label>
        <input matInput [(ngModel)]="data.Queueid">
      </mat-form-field>
      <mat-form-field appearance="fill" class="col-md-12">
        <mat-label>RoomInfo</mat-label>
        <input matInput [(ngModel)]="data.RoomInfo">
      </mat-form-field>
      <mat-form-field appearance="fill" class="col-md-12">
        <mat-label>ServingInfo</mat-label>
        <input matInput [(ngModel)]="data.ServingInfo">
      </mat-form-field>
      <mat-form-field appearance="fill" class="col-md-12">
        <mat-label>QueueNo</mat-label>
        <input matInput [(ngModel)]="data.QueueNo">
      </mat-form-field>
      <mat-form-field appearance="fill" class="col-md-12">
        <mat-label>DoctorInfo</mat-label>
        <input matInput [(ngModel)]="data.DoctorInfo">
      </mat-form-field>
    </div>
    <div class="col-md-6">
      <mat-form-field appearance="fill" class="col-md-12">
        <mat-label>AssistantInfo</mat-label>
        <input matInput [(ngModel)]="data.AssistantInfo">
      </mat-form-field>
      <section class="col-md-12">
        <mat-checkbox class="example-margin" [(ngModel)]="data.Beep">Beep</mat-checkbox>
      </section>
      <section class="col-md-12">
        <mat-checkbox class="example-margin" [(ngModel)]="data.Flash">Flash</mat-checkbox>
      </section>
      <mat-form-field appearance="fill" class="col-md-12">
        <mat-label>CallAction</mat-label>
        <mat-select [(ngModel)]="data.CallAction">
          <mat-option value="call">
            Call
          </mat-option>
          <mat-option value="clear">
            Clear
          </mat-option>
          <mat-option value="missed queue">
            Missed Queue
          </mat-option>
          <mat-option value="silent call">
            Silent Call
          </mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill" class="col-md-12">
        <mat-label>Timestamp</mat-label>
        <input type="datetime-local" matInput [(ngModel)]="data.Timestamp">
      </mat-form-field>
    </div>
  </div>
</div>
<div mat-dialog-actions style="justify-content: center">
  <button mat-button (click)="onNoClick()">Cancel</button>
  <button mat-button *ngIf="token" [mat-dialog-close]="data" cdkFocusInitial>Send</button>
</div>
