<div>
  <header class="pageHeader">
    <h3>Queue Monitor</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-8">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'queueTableMaps.management.Search' | translate}}">></search-box>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="navbar action-box">
        <ul class="nav navbar-nav navbar-right">
          <li *ngIf="canManageQueueTableMaps" class="toolbaritem">
            <a href="javascript:;" (click)="newQueueTableMap(row)">
              <i class="fa fa-plus-circle"></i> {{'queueTableMaps.management.New' | translate}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ngx-datatable class="material colored-header"
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [columns]="columns"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [columnMode]="'force'"
                 [limit]="20">
  </ngx-datatable>



  <style>
   
  </style>


  <ng-template #indexTemplate let-value="value">
    <strong>{{value}}</strong>
  </ng-template>


  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageQueueTableMaps" class="btn btn-link btn-xs" href="javascript:;" (click)="editQueueTableMap(row)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'queueTableMaps.management.Edit' | translate}}</a>
    <a class="btn btn-link btn-xs" href="javascript:;" (click)="openSimulator(row)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'queueTableMaps.management.Simulator' | translate}}</a>
    <a *ngIf="!canManageQueueTableMaps" class="btn btn-link btn-xs" href="javascript:;" (click)="editQueueTableMap(row)"><i class="fa fa-eye" aria-hidden="true"></i> {{'queueTableMaps.management.Details' | translate}}</a>
    <!--{{canManageQueueTableMaps ? '|' : ''}}-->
    <a *ngIf="canManageQueueTableMaps" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteQueueTableMap(row)"><i class="fa fa-trash-o" aria-hidden="true"></i> {{'queueTableMaps.management.Delete' | translate}}</a>
  </ng-template>
  <queue-table-map-editor #queueTableMapEditor [hidden]="true"></queue-table-map-editor>
</div>
