<div class="container">
  <header class="pageHeader">
    <div class="row">
      <div class="col-md-8">
        <h3><i class="fa fa-handshake fa-lg page-caption" aria-hidden="true"></i> Media Gallery</h3>
      </div>
      <div class="col-md-4" style="text-align: right;margin-top: 20px;">
        <button type="button" mat-button class="btn btn-sm" (click)="cancel()">Cancel</button>
        <button type="button" mat-button class="btn btn-sm btn-info" (click)="save()">Save</button>
      </div>
    </div>
  </header>
  <div [@fadeInOut]>

    <div class="col-md-5">
      <mat-form-field style="width:100%">
        <input matInput type="text" id="" name="imageTitle" placeholder="Enter media name" [(ngModel)]="imageEdit.title" #imageTitle="ngModel" required minlength="2" maxlength="200" />
      </mat-form-field>

      <br />

      <mat-form-field style="width:100%">
        <textarea matInput type="text" id="" name="imageDescription" placeholder="Description" [(ngModel)]="imageEdit.description" imageDescription="ngModel"></textarea>
      </mat-form-field>

      <br />

      <mat-form-field style="width:100%">
        <textarea matInput type="text" id="" name="imageTags" placeholder="Enter tags separated by space" [(ngModel)]="imageEdit.tags" imageTags="ngModel"></textarea>
      </mat-form-field>

      <br />

      <mat-form-field appearance="fill" style="width:100%">
        <mat-label>Media Group</mat-label>
        <mat-select [(ngModel)]="imageEdit.mediaId" name="Media Group">
          <mat-option [value]="">
            -- Select Media Group --
          </mat-option>
          <mat-option *ngFor="let m of allMedias" [value]="m.id">
            {{m.name}}
          </mat-option>
        </mat-select>

      </mat-form-field>

      <section class="example-section">
        <mat-checkbox class="example-margin" [(ngModel)]="imageEdit.isVideo">Is Video</mat-checkbox>
      </section>
      <image-upload *ngIf="!imageEdit.id" showTxt="false" (onUploadFinished)="uploadFinished($event)" #imgUpload></image-upload>

    </div>

    <div *ngIf="imageEdit.imageLocation" class="col-md-7" style="padding:10px; border: 1px dashed #808080;text-align:center">
      <img *ngIf="!imageEdit.isVideo" [src]="imageEdit.imageLocation" alt="icon" style="width:100%; height:100%;" />
      <video controls *ngIf="imageEdit.isVideo" [src]="imageEdit.imageLocation + '#t=0.1'" style="width:100%; height:100%;"></video>
    </div>

    <!--<div *ngIf="filePath" class="col-md-4" style="padding:10px; border: 1px dashed #808080;text-align:center">
      <img [src]="getFileImage(filePath)" alt="icon" style="width:100%; height:100%;" />
    </div>-->

  </div>

</div>
