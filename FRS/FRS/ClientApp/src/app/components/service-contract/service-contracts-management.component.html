<div>
  <header class="pageHeader">
    <h3>Service Contracts</h3>
  </header>
  <div class="row">
    <div class="col-xs-12 col-sm-4 col-md-3">
      <div class="form-group search-box">
        <search-box #searchbox (searchChange)="onSearchChanged($event)" (onEnter)="onSearch()" placeholder="Search"></search-box> 
      </div>
    </div>
    <div class="col-xs-6 col-sm-4 col-md-2">
      <mat-form-field>
        <input matInput [matDatepicker]="startpicker" placeholder="Start Date" [value]="start"
               (dateChange)="onChangeDate('start', $event)">
        <mat-datepicker-toggle matSuffix [for]="startpicker"></mat-datepicker-toggle>
        <mat-datepicker #startpicker></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col-xs-6 col-sm-4 col-md-2">
      <mat-form-field>
        <input matInput [matDatepicker]="endpicker" placeholder="End Date" [value]="end"
               (dateChange)="onChangeDate('end',$event)">
        <mat-datepicker-toggle matSuffix [for]="endpicker"></mat-datepicker-toggle>
        <mat-datepicker #endpicker></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col-xs-8 col-sm-8 col-md-3 filter-section">
      <button type="button" class="btn btn-sm" (click)="clearFilters();">Clear</button>
      <button type="button" class="btn btn-sm btn-info" (click)="loadData();">Filter</button>
      <button type="button" class="btn btn-sm btn-info" (click)="downloadResults();" style="margin-left:5px;">Export</button>
    </div>
    <div class="col-xs-4 col-md-2 filter-section">
      <div class="navbar action-box">
        <ul class="nav navbar-nav navbar-right">
          <li *ngIf="canManageServiceContracts" class="toolbaritem">
            <a href="javascript:;" (click)="newServiceContract(row)">
              <i class="fa fa-plus-circle"></i> {{'common.New' | translate}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ngx-datatable #serviceContractTable class="material colored-header"
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [externalPaging]="true"
                 [externalSorting]="true"
                 [count]="pagedResult.totalCount"
                 [offset]="pagedResult.filter.pageNumber"
                 [limit]="pagedResult.filter.pageSize"
                 (page)="loadData($event)"
                 (sort)="loadData($event)">
  </ngx-datatable>

  <ng-template #iconTemplate let-row="row" let-value="value" let-i="index">
    <div *ngIf="row.filePath">
      <img [src]="getFileImage(row.filePath)" alt="icon" style="width:50px; height:50px;" />
    </div>
  </ng-template>


  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageServiceContracts" class="btn btn-link btn-xs" href="javascript:;" (click)="editServiceContract(row)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'common.RowAction.Edit' | translate}}</a>
    <a *ngIf="!canManageServiceContracts" class="btn btn-link btn-xs" href="javascript:;" (click)="editServiceContract(row)"><i class="fa fa-eye" aria-hidden="true"></i> {{'common.RowAction.Details' | translate}}</a>
    <!--{{canManageServiceContracts ? '|' : ''}}-->
    <a *ngIf="canManageServiceContracts" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteServiceContract(row)"><i class="fa fa-trash-o" aria-hidden="true"></i> {{'common.RowAction.Delete' | translate}}</a>
  </ng-template>
</div>
