<div>
  <header class="pageHeader">
    <h3>Authentication Logs</h3>
  </header>
  <div class="row control-box">
    <div class="col-xs-12 col-sm-4">
      <div class="form-group search-box">
        <search-box #searchbox (searchChange)="onSearchChanged($event)" (onEnter)="onSearch()" placeholder="Search"></search-box>
      </div>
    </div>
    <div class="col-xs-6 col-sm-4 col-md-2">
      <mat-form-field>
        <input matInput [matDatepicker]="startpicker" placeholder="Start Date" [value]="start"
               (dateChange)="onChangeDate('start', $event)">
        <mat-datepicker-toggle matSuffix [for]="startpicker"></mat-datepicker-toggle>
        <mat-datepicker #startpicker></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col-xs-6 col-sm-4 col-md-2">
      <mat-form-field>
        <input matInput [matDatepicker]="endpicker" placeholder="End Date" [value]="end"
               (dateChange)="onChangeDate('end',$event)">
        <mat-datepicker-toggle matSuffix [for]="endpicker"></mat-datepicker-toggle>
        <mat-datepicker #endpicker></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col-xs-12 col-sm-12 col-md-4" style="padding-bottom:10px;">
      <button type="button" class="btn btn-sm" (click)="clearFilters();">Clear</button>
      <button type="button" class="btn btn-sm btn-info" (click)="loadData();">Filter</button>
      <button type="button" class="btn btn-sm btn-info" (click)="downloadResults();" style="margin-left:5px;">Download Results</button>
    </div>
  </div>

  <div class="table-responsive">
    <ngx-datatable class="material colored-header" #authLogTable
                   [loadingIndicator]="loadingIndicator"
                   [rows]="rows"
                   [rowHeight]="'auto'"
                   [headerHeight]="'auto'"
                   [footerHeight]="35"
                   [columns]="columns"
                   [columnMode]="'force'"
                   [externalPaging]="true"
                   [externalSorting]="true"
                   [count]="pagedResult.totalCount"
                   [limit]="pagedResult.filter.pageSize"
                   (page)="loadData($event)"
                   (sort)="loadData($event)">
    </ngx-datatable>
  </div>
  <ng-template #indexTemplate let-value="value" let-rowCount="rowCount" let-pageSize="pageSize" let-curPage="curPage" let-offset="offset">
    <strong>{{value}}</strong>
  </ng-template>
</div>
