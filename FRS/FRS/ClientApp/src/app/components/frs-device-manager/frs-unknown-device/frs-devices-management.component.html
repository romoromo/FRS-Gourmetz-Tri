<div class="container">
  <header class="pageHeader">
    <h3>Epaper Device Management</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-6">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'devices.management.Search' | translate}}">></search-box>
      </div>
    </div>
    <div class="col-sm-6">
      <div class="navbar action-box">
        <ul class="nav navbar-nav navbar-right">
          <li *ngIf="canManageEpaperDevices" class="toolbaritem">
            <a href="javascript:;" (click)="loadData()">
              <i class="fa fa-refresh"></i> Refresh
            </a>
          </li>
          <li *ngIf="canManageEpaperDevices" class="toolbaritem">
            <a href="javascript:;" (click)="newEpaperDevice(row)">
              <i class="fa fa-plus-circle"></i> {{'devices.management.NewDevice' | translate}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ngx-datatable class="material colored-header"
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [limit]="20">
  </ngx-datatable>

  <ng-template #indexTemplate let-value="value">
    <strong>{{value}}</strong>
  </ng-template>
  <ng-template #statusTemplate let-row="row" let-value="value" let-i="index">
    <span *ngIf="row.status_display =='ONLINE'" title="Device is online">
      <i class="status_online material-icons">fiber_manual_record</i>
    </span>
    <span *ngIf="row.status_display !='ONLINE'" title="Device is offline">
      <i class="status_offline material-icons" >fiber_manual_record</i>
    </span>
  </ng-template>

  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageEpaperDevices" class="btn btn-link btn-xs" href="javascript:;" (click)="editEpaperDevice(row, false)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'devices.management.Edit' | translate}}</a>
    <!--{{canManageEpaperDevices ? '|' : ''}}-->
    <a *ngIf="canManageEpaperDevices" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteEpaperDevice(row)"><i class="fa fa-trash-o" aria-hidden="true"></i> {{'devices.management.Delete' | translate}}</a>
  </ng-template>
  <frs-device-editor #epaperDeviceEditor class="hide"></frs-device-editor>
</div>
