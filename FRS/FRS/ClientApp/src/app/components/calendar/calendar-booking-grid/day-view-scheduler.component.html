<div class="cal-day-view" #dayViewContainer>
  <div class="day-view-column-headers">
    <div class="day-view-column-header">
      &nbsp;
    </div>
    <ng-container *ngFor="let parentLocation of locations">
      <div class="day-view-column-header" style="font-weight: 500; background-color: #f9f9f9;text-align: left; padding-left: 10px;">
        {{ parentLocation.name }}
      </div>
      <div class="day-view-column-header" *ngFor="let location of parentLocation.children">
        {{ location.name }}
      </div>
    </ng-container>
  </div>
  <div class="cal-day-view-hour-container">
    <div class="cal-hour-header">
      <div class="cal-hour-cols">
        <div class="cal-hour"
             *ngFor="let hour of hours; trackBy: trackByHour">
          <mwl-calendar-day-view-hour-segment *ngFor="let segment of hour.segments; trackBy: trackByHourSegment"
                                              [style.height.px]="hourSegmentHeight"
                                              [segment]="segment"
                                              [segmentHeight]="hourSegmentHeight"
                                              [locale]="locale"
                                              [customTemplate]="hourSegmentTemplate">
          </mwl-calendar-day-view-hour-segment>
        </div>
      </div>
      <ng-container *ngFor="let parentLocation of locations">
      <div class="cal-hour-container">
        <div class="cal-hour-cols" style="background-color: #f9f9f9">

        </div>
      </div>
      <div *ngFor="let location of parentLocation.children" class="cal-hour-container">
        <div class="cal-hour-cols"
             mwlDroppable
             (dragEnter)="eventDragEnter = eventDragEnter + 1"
             (dragLeave)="eventDragEnter = eventDragEnter - 1">
          <div class="cal-events">
            <div #event
                 *ngFor="let dayEvent of getEvents(location, view?.events); trackBy: trackByDayEvent"
                 class="cal-event-container"
                 [class.cal-draggable]="dayEvent.event.draggable"
                 [class.cal-starts-within-day]="!dayEvent.startsBeforeDay"
                 [class.cal-ends-within-day]="!dayEvent.endsAfterDay"
                 [ngClass]="dayEvent.event.cssClass"
                 mwlResizable
                 [resizeSnapGrid]="{
        top: eventSnapSize || hourSegmentHeight,
        bottom: eventSnapSize || hourSegmentHeight
        }"
                 [validateResize]="validateResize"
                 (resizeStart)="resizeStarted(dayEvent, $event, dayViewContainer)"
                 (resizing)="resizing(dayEvent, $event)"
                 (resizeEnd)="resizeEnded(dayEvent)"
                 mwlDraggable
                 [dragAxis]="{
        x: dayEvent.event.draggable && currentResizes.size === 0,
        y: currentResizes.size === 0
        }"
                 [dragSnapGrid]="{
        y: eventSnapSize || hourSegmentHeight,
        x: eventWidth
        }"
                 [validateDrag]="validateDrag"
                 (dragStart)="dragStarted(event, dayViewContainer)"
                 (dragging)="dragMove()"
                 (dragEnd)="eventDragged(dayEvent, $event.x, $event.y)"
                 
                 [style.height.px]="dayEvent.height"
                 [style.left.px]="dayEvent.left"
                 
                 [style.width.px]="dayEvent.width - 1">
              <div class="cal-resize-handle cal-resize-handle-before-start"
                   *ngIf="
        dayEvent.event?.resizable?.beforeStart && !dayEvent.startsBeforeDay
        "
                   mwlResizeHandle
                   [resizeEdges]="{ top: true }"></div>
              <!--<mwl-calendar-day-view-event [dayEvent]="dayEvent"
                                           [tooltipPlacement]="tooltipPlacement"
                                           [tooltipTemplate]="tooltipTemplate"
                                           [tooltipAppendToBody]="tooltipAppendToBody"
                                           [customTemplate]="eventTemplate"
                                           [eventTitleTemplate]="eventTitleTemplate"
                                           [eventActionsTemplate]="eventActionsTemplate"
                                           (eventClicked)="eventClicked.emit({ event: dayEvent.event })">
              </mwl-calendar-day-view-event>-->
            
                <ng-template #defaultTemplate
                             let-dayEvent="dayEvent"
                             let-tooltipPlacement="tooltipPlacement"
                             let-eventClicked="eventClicked"
                             let-tooltipTemplate="tooltipTemplate"
                             let-tooltipAppendToBody="tooltipAppendToBody">
                  <div class="cal-event"
                       [style.height.px]="dayEvent.height"
                       [style.backgroundColor]="dayEvent.event.color?.secondary"
                       [style.borderColor]="dayEvent.event.color?.primary"
                       [style.width.px]="dayEvent.width - 1"
                       [mwlCalendarTooltip]="
          dayEvent.event.title | calendarEventTitle: 'dayTooltip':dayEvent.event
        "
                       [tooltipPlacement]="tooltipPlacement"
                       [tooltipEvent]="dayEvent.event"
                       [tooltipTemplate]="tooltipTemplate"
                       [tooltipAppendToBody]="tooltipAppendToBody"
                       (mwlClick)="eventClicked.emit()">
                    <mwl-calendar-event-actions [event]="dayEvent.event"
                                                [customTemplate]="eventActionsTemplate">
                    </mwl-calendar-event-actions>
                    &ngsp;
                    <mwl-calendar-event-title [event]="dayEvent.event"
                                              [customTemplate]="eventTitleTemplate"
                                              view="day">
                    </mwl-calendar-event-title>
                  </div>
                </ng-template>
                <ng-template [ngTemplateOutlet]="customTemplate || defaultTemplate"
                             [ngTemplateOutletContext]="{
        dayEvent: dayEvent,
        tooltipPlacement: tooltipPlacement,
        eventClicked: eventClicked,
        tooltipTemplate: tooltipTemplate,
        tooltipAppendToBody: tooltipAppendToBody
      }">
                </ng-template>
              
              <div class="cal-resize-handle cal-resize-handle-after-end"
                   *ngIf="dayEvent.event?.resizable?.afterEnd && !dayEvent.endsAfterDay"
                   mwlResizeHandle
                   [resizeEdges]="{ bottom: true }"></div>
            </div>
          </div>
          <div class="cal-hour"
               *ngFor="let hour of hours; trackBy: trackByHour">
            <div *ngFor="let segment of hour.segments; trackBy: trackByHourSegment" [ngClass]="cssPastTime(segment)">
              <ng-template #defaultTemplate
                           let-segment="segment"
                           let-locale="locale"
                           let-segmentHeight="hourSegmentHeight">
                <div #segmentElement
                     class="cal-hour-segment"
                     [style.height.px]="segmentHeight"
                     [class.cal-hour-start]="segment.isStart"
                     [class.cal-after-hour-start]="!segment.isStart"
                     [ngClass]="segment.cssClass"
                     (dblclick)="createDefaultEvent(segment, $event, segmentElement, location)"
                     (mousedown)="startDragToCreate(segment, $event, segmentElement, location)">
                  <div class="cal-time">
                    <!--{{ segment.date | calendarDate: 'dayViewHour':locale }}-->
                  </div>
                </div>
              </ng-template>
              <ng-template [ngTemplateOutlet]="customTemplate || defaultTemplate"
                           [ngTemplateOutletContext]="{
        segment: segment,
        locale: locale,
        segmentHeight: segmentHeight
      }">
              </ng-template>
            </div>
            <!--<mwl-calendar-day-view-hour-segment *ngFor="let segment of hour.segments; trackBy: trackByHourSegment"
                                                [style.height.px]="hourSegmentHeight"
                                                [segment]="segment"
                                                [segmentHeight]="hourSegmentHeight"
                                                [locale]="locale"
                                                [customTemplate]="hourSegmentTemplate"
                                                (mwlClick)="hourSegmentClicked.emit({ date: segment.date })"
                                                mwlDroppable
                                                dragOverClass="cal-drag-over"
                                                dragActiveClass="cal-drag-active"
                                                (drop)="eventDropped($event, segment.date, false)">
            </mwl-calendar-day-view-hour-segment>-->
          </div>
        </div>
      </div>
      </ng-container>
    </div>
  </div>
</div>
