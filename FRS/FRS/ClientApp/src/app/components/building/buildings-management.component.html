<div>
  <header class="pageHeader">
    <h3>Buildings</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-8">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'buildings.management.Search' | translate}}">></search-box>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="navbar action-box">
        <ul class="nav navbar-nav navbar-right">
          <li *ngIf="canManageBuildings" class="toolbaritem">
            <a href="javascript:;" (click)="newBuilding(row)">
              <i class="fa fa-plus-circle"></i> {{'buildings.management.New' | translate}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ngx-datatable class="material colored-header"
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [limit]="20">
  </ngx-datatable>

  <ng-template #indexTemplate let-value="value">
    <strong>{{value}}</strong>
  </ng-template>


  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageBuildings" class="btn btn-link btn-xs" href="javascript:;" (click)="editBuilding(row)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'buildings.management.Edit' | translate}}</a>
    <a *ngIf="!canManageBuildings" class="btn btn-link btn-xs" href="javascript:;" (click)="editBuilding(row)"><i class="fa fa-eye" aria-hidden="true"></i> {{'buildings.management.Details' | translate}}</a>
    <!--{{canManageBuildings ? '|' : ''}}-->
    <a *ngIf="canManageBuildings" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteBuilding(row)"><i class="fa fa-trash-o" aria-hidden="true"></i> {{'buildings.management.Delete' | translate}}</a>
  </ng-template>
  <building-editor #buildingEditor [hidden]="true"></building-editor>
</div>
