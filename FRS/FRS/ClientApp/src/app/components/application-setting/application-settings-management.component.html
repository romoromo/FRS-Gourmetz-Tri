<div>
  <header class="pageHeader">
    <h3>Application Settings</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-8">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'applicationSettings.management.Search' | translate}}">></search-box>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="navbar action-box">
        <ul class="nav navbar-nav navbar-right">
          <li *ngIf="canManageApplicationSettings" class="toolbaritem">
            <a href="javascript:;" (click)="newApplicationSetting(row)">
              <i class="fa fa-plus-circle"></i> {{'applicationSettings.management.NewApplicationSetting' | translate}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ngx-datatable class="material colored-header"
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [limit]="20">
  </ngx-datatable>

  <ng-template #indexTemplate let-value="value">
    <strong>{{value}}</strong>
  </ng-template>


  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageApplicationSettings" class="btn btn-link btn-xs" href="javascript:;" (click)="editApplicationSetting(row)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'applicationSettings.management.Edit' | translate}}</a>
    <a *ngIf="!canManageApplicationSettings" class="btn btn-link btn-xs" href="javascript:;" (click)="editApplicationSetting(row)"><i class="fa fa-eye" aria-hidden="true"></i> {{'applicationSettings.management.Details' | translate}}</a>
    <!--{{canManageApplicationSettings ? '|' : ''}}-->
    <a *ngIf="canManageApplicationSettings" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteApplicationSetting(row)"><i class="fa fa-trash-o" aria-hidden="true"></i> {{'applicationSettings.management.Delete' | translate}}</a>
  </ng-template>
  <application-setting-editor #applicationSettingEditor [hidden]="true"></application-setting-editor>
</div>
