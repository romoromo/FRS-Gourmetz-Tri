<!--<h1 mat-dialog-title>{{data.header}}</h1>-->
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="signageCompilationEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!signageCompilationName.valid && showErrorAlert('Signage component name is required', 'Please enter a signage compilation name (minimum of 2 and maximum of 200 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-md-12">
            <input matInput [disabled]="!canManageSignageCompilations" type="text" id="signageCompilationName" name="signageCompilationName" placeholder="Enter name" [(ngModel)]="signageCompilationEdit.name" #signageCompilationName="ngModel" required />
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <input matInput [disabled]="!canManageSignageCompilations" type="text" id="signageCompilationDescription" name="signageCompilationDescription" placeholder="Enter description" [(ngModel)]="signageCompilationEdit.description" #signageCompilationDescription="ngModel" required />
          </mat-form-field>

          <mat-form-field class="col-md-12">
            <input matInput [disabled]="!canManageSignageCompilations" type="number" id="signageCompilationWidth" name="signageCompilationWidth" placeholder="Enter resolution width" [(ngModel)]="signageCompilationEdit.width" #signageCompilationWidth="ngModel" />
          </mat-form-field>

          <mat-form-field class="col-md-12">
            <input matInput [disabled]="!canManageSignageCompilations" type="number" id="signageCompilationHeight" name="signageCompilationHeight" placeholder="Enter resoltion height" [(ngModel)]="signageCompilationEdit.height" #signageCompilationHeight="ngModel" />
          </mat-form-field>

          <div class="col-md-12">
            Background Image <file-upload (onUploadFinished)="uploadFinished($event)"></file-upload>
            <span *ngIf="signageCompilationEdit.backgroundImage" (click)="signageCompilationEdit.backgroundImage = null" class="btn btn-danger">Remove</span>
            <br />
            <img [hidden]="!signageCompilationEdit.backgroundImage" [src]="signageCompilationEdit.backgroundImage" style="max-width: 300px; max-height: 300px;padding:2px" />
          </div>

          <mat-form-field class="col-md-12">
            <input matInput [disabled]="!canManageSignageCompilations" id="signageCompilationBackgroundColor" name="signageCompilationBackgroundColor" placeholder="Enter background color (optional)" [(colorPicker)]="signageCompilationEdit.backgroundColor" [style.background]="signageCompilationEdit.backgroundColor" />
            <input  />
          </mat-form-field>

          <!--<div class="col-md-12 example-boundary" >
            <div class="example-box" cdkDragBoundary=".example-boundary" cdkDrag>
              I can only be dragged using the handle

              <div class="example-handle" cdkDragHandle>
                <svg width="24px" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"></path>
                  <path d="M0 0h24v24H0z" fill="none"></path>
                </svg>
              </div>
            </div>
          </div>-->

          <div class="col-md-6">
            <h3>Layout</h3>
            <div style="width:100%;background-color:#d4fefe;border:solid 1px;position:relative" #compilationContainer [style.height.px]="getHeight()" >
              <div class="example-box"  (dragover)="dragEndeds($event, c, signageCompilationEdit.width, signageCompilationEdit.height)" [style.visibility]="!c.isActive ? 'hidden': 'visible'" *ngFor="let c of signageCompilationEdit.components" style="background-color:#faaaaa;position:absolute;border:solid 1px" [style.left.px]="c.x * scale" [style.top.px]="c.y  * scale" [style.width.px]="c.width  * scale" [style.height.px]="c.height  * scale" [style.z-index]="c.order">
                {{c.name}}
                <!--<div class="example-handle" cdkDragHandle>
                  <svg width="24px" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"></path>
                    <path d="M0 0h24v24H0z" fill="none"></path>
                  </svg>
                </div>-->
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <h3>&nbsp;</h3>
            <mat-form-field appearance="fill" style="width:90%">
              <mat-label>Select Components</mat-label>
              <mat-select [(ngModel)]="selected" name="signageComponent">
                <mat-option>
                  <ngx-mat-select-search placeholderLabel="Search" [formControl]="searchForm"></ngx-mat-select-search>
                </mat-option>
                <mat-option [style.display]="(sc.name).toLowerCase().includes((searchForm?.value || '').toLowerCase()) ? 'block' : 'none'" *ngFor="let sc of signageComponents" [value]="sc">
                  {{sc.name}}
                </mat-option>
              </mat-select>

            </mat-form-field>
            <span class="btn btn-primary" (click)="add(selected)"><i class='fa fa-plus'></i> Add</span>
            <br />
            <div [hidden]="!c.isActive" *ngFor="let c of signageCompilationEdit.components;let index = index;trackBy:trackByIndex;" style="margin-bottom:10px">
              <span class="btn-xs" (click)="c.isActive = 0"><i class='fa fa-times'></i> Remove</span> &nbsp; <span>{{c.name}}</span>  <br />
              x <input style="width:100px;margin-right:20px" type="number" [(ngModel)]="c.x" placeholder="x" name="x{{index}}" min="0" (change)="xChanged($event, c, signageCompilationEdit.width)" />

              y <input style="width:100px;margin-right:20px" type="number" [(ngModel)]="c.y" placeholder="y" name="y{{index}}" min="0" (change)="yChanged($event, c, signageCompilationEdit.height)" />

              w <input style="width:100px;margin-right:20px" type="number" [(ngModel)]="c.width" placeholder="w" name="w{{index}}" min="0" (change)="wChanged($event, c, signageCompilationEdit.width)" />

              h <input style="width:100px;margin-right:20px" type="number" [(ngModel)]="c.height" placeholder="h" name="h{{index}}" min="0" (change)="hChanged($event, c, signageCompilationEdit.height)" />

              order <input style="width:100px;margin-right:20px" type="number" [(ngModel)]="c.order" placeholder="o" name="o{{index}}" min="0" />
              <br />
            </div>
          </div>
          <!--<div class="form-group has-feedback">
            <label class="control-label col-md-2" for="signageCompilationName">{{'signageCompilations.editor.Name' | translate}}</label>
            <div class="col-md-10" [ngClass]="{'has-success': f.submitted && signageCompilationName.valid, 'has-error' : f.submitted && !signageCompilationName.valid}">
              <input [disabled]="!canManageSignageCompilations" type="text" id="signageCompilationName" name="signageCompilationName" placeholder="Enter signageCompilation name" class="form-control" [(ngModel)]="signageCompilationEdit.name" #signageCompilationName="ngModel" required minlength="2" maxlength="200" />
              <span *ngIf="showValidationErrors && f.submitted" class="glyphicon form-control-feedback" [ngClass]="{'glyphicon-ok ': signageCompilationName.valid, 'glyphicon-remove' : !signageCompilationName.valid}"></span>
            </div>
          </div>-->
        </div>

        <!--<div class="col-sm-12">
          <div class="form-group">
            <label class="control-label col-md-2" for="signageCompilationDescription">{{'signageCompilations.editor.Description' | translate}}</label>
            <div class="col-md-10">
              <input [disabled]="!canManageSignageCompilations" type="text" id="signageCompilationDescription" name="signageCompilationDescription" placeholder="Enter signageCompilation description" class="form-control" [(ngModel)]="signageCompilationEdit.description" />
            </div>
          </div>
        </div>-->
      </div>

      <!--<div class="row">
        <div class="col-md-12">
          <span *ngIf="showValidationErrors && f.submitted && !signageCompilationName.valid" class="errorMessage signageCompilationErrorMessage">
            {{'signageCompilations.editor.SignageCompilationNameRequired' | translate}}
          </span>
        </div>
      </div>

      <div class="row">
        <div class="col-md-12">
          <hr class="edit-separator-hr" />
        </div>
      </div>-->

        <div class="col-sm-7">
          <div ngPreserveWhitespaces class="pull-right">
            <button *ngIf="!canManageSignageCompilations" type="button" (click)="cancel()" class="btn btn-default">{{'signageCompilations.editor.Close' | translate}}</button>
            <button *ngIf="canManageSignageCompilations" type="button" (click)="cancel()" class="btn btn-danger" [disabled]="isSaving"><i class='fa fa-times'></i> {{'signageCompilations.editor.Cancel' | translate}}</button>

            </button>
          </div>
        </div>
      </div>-->
      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageSignageCompilations" type="button" mat-button (click)="cancel()">{{'signageCompilations.editor.Close' | translate}}</button>
      <button *ngIf="canManageSignageCompilations" type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'signageCompilations.editor.Cancel' | translate}}</button>
      <button *ngIf="canManageSignageCompilations" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('signageCompilations.editor.Saving' | translate) : ('signageCompilations.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
