<mat-form-field class="example-full-width" appearance="fill">
  <mat-label>Refresh Interval</mat-label>
  <input matInput type="number" min="1" placeholder="(optional in seconds)" [(ngModel)]="configurations.interval">
</mat-form-field>

<div style="padding: 10px;border: solid 1px;border-radius: 10px;">
  <section class="example-section">
    <mat-checkbox class="example-margin" [(ngModel)]="configurations.text1.hide">Hide Date Text</mat-checkbox>
  </section>

  <mat-form-field class="example-full-width" appearance="fill">
    <mat-label>Format</mat-label>
    <input matInput placeholder="dd-MM-yyyy"  [(ngModel)]="configurations.text1.format" >
  </mat-form-field>
  <br/>

  <text-configuration *ngIf="!configurations.text1?.hide" [(configurations)]="configurations.text1"></text-configuration>
</div>


<div style="padding: 10px;border: solid 1px;border-radius: 10px;">
  <section class="example-section">
    <mat-checkbox class="example-margin" [(ngModel)]="configurations.text2.hide">Hide Time Text</mat-checkbox>
  </section>

  <mat-form-field class="example-full-width" appearance="fill">
    <mat-label>Format</mat-label>
    <input matInput placeholder="hh:mm aa" [(ngModel)]="configurations.text2.format">
  </mat-form-field>
  <br />

  <text-configuration *ngIf="!configurations.text2?.hide" [(configurations)]="configurations.text2"></text-configuration>
</div>

<table class="table">
  <thead>
    <tr>
      <th>Format Example</th>
      <th>Output</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><code>d-M-y h:m a</code></td>
      <td><code>15-6-2015 9:3 AM</code></td>
    </tr>
    <tr>
      <td><code>dd-MM-yyyy hh:mm aa</code></td>
      <td><code>15-06-2015 09:03 AM</code></td>
    </tr>
    <tr>
      <td><code>E, d MMM y h:m a</code></td>
      <td><code>Mon, 15 Jun 2015 9:3 AM</code></td>
    </tr>
    <tr>
      <td><code>EEEE, d MMMM y h:mm a</code></td>
      <td><code>Monday, 15 June 2015 9:03 AM</code></td>
    </tr>
  </tbody>
</table>
