<div>
  <div style="padding: 10px;border: solid 1px;border-radius: 10px;">
    <section class="example-section">
      <mat-checkbox class="example-margin" [(ngModel)]="configurations.name.hide">Hide Location Name</mat-checkbox>
    </section>

    <text-configuration *ngIf="!configurations.name.hide" [(configurations)]="configurations.name"></text-configuration>
  </div>

  <div style="padding: 10px;border: solid 1px;border-radius: 10px;">
    <section class="example-section">
      <mat-checkbox class="example-margin" [(ngModel)]="configurations.group.hide">Hide Location Group</mat-checkbox>
    </section>

    <text-configuration *ngIf="!configurations.group.hide" [(configurations)]="configurations.group"></text-configuration>
  </div>

</div>
