<div class="center-content">
  <h2 class="bottom-space text-center">{{'pageHeader.Feedback' | translate}}</h2>
  <form *ngIf="formResetToggle" class="form-horizontal" name="feedbackForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :

          ((!feedback || !feedback.feedback) && showErrorAlert('Please select one'));
          ;">
    <div class="row">
      <div class="col-xs-12 col-sm-offset-2 col-sm-8">
        <mat-card>
          <mat-card-header>
            <!--<div mat-card-avatar class="example-header-image"></div>-->
            <mat-card-title class="upcoming-event-title">
              <div class="row">
                <h3>How did the event go?</h3>
              </div>
            </mat-card-title>
            <mat-card-subtitle>

            </mat-card-subtitle>
          </mat-card-header>
          <mat-card-content style="padding-top:10px;text-align: center;">
            <div class="row">
              <div class="col-sm-12 col-md-3 choices" *ngFor="let c of choices">
                <a mat-icon-button (click)="feedback.feedback = c;" [class.selected]="feedback.feedback == c">
                  <mat-icon>{{c.icon}}</mat-icon>
                  <div>{{c.name}}</div>
                </a>
                
              </div>
              <div class="clearfix bottom-space"></div>
              <mat-form-field class="col-xs-12">
                <mat-label>Leave a comment</mat-label>
                <textarea matInput placeholder="" [(ngModel)]="feedback.comment" rows="5" name="comment"></textarea>
              </mat-form-field>
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-primary" [disabled]="isSaving">
                <i *ngIf="!isSaving" class='fa fa-check'> </i>
                <i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'> </i>
                {{isSaving ? 'Processing' : 'Submit'}}
              </button>
            </div>
          </mat-card-content>
        </mat-card>
      </div>

    </div>
    <div class="clearfix bottom-space"></div>
  </form>
</div>
