<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="settingsEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!settingsLabel.valid && showErrorAlert('Kiosk Settings Label is required', 'Please enter kiosk settings label (minimum of 2 and maximum of 200 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-md-12">
            <input matInput type="text" id="settingsLabel" name="settingsLabel" placeholder="Label" [(ngModel)]="settingsEdit.label" #settingsLabel="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>
          <div class="form-group">
            <div class="col-md-12">
              <label [class.col-md-2] class="control-label" for="facilities-facility-icon">Hospital Banner</label>
              <div class="col-md-12">
                <file-upload (onUploadFinished)="uploadFinished($event)" fileTypes="image/*"></file-upload>
              </div>
              <div *ngIf="settingsEdit.dir_font_type" class="col-md-9" style="padding:10px; border: 1px dashed #808080;text-align:center">
                <img [src]="getFileImage(settingsEdit.dir_font_type)" alt="icon" style="height:150px;" />
              </div>
            </div>
          </div>
          <mat-form-field class="col-md-12">
            <input matInput type="number" id="screenSaveTime" name="screenSaveTime" placeholder="Screen Save Time" [(ngModel)]="settingsEdit.screen_save_time" #settingsLabel="ngModel" />
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <mat-select placeholder="Screen Saver Playlist" [(ngModel)]="settingsEdit.ss_playlist_id" name="ssPlaylistid">
              <mat-option *ngFor="let playlist of allPlaylists" [value]="playlist.id"><b>{{playlist.name}}</b> - <small><i>{{playlist.description}}</i></small></mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <mat-select placeholder="Top Banner Playlist" [(ngModel)]="settingsEdit.top_banner_id" name="topBannerId">
              <mat-option *ngFor="let playlist of allPlaylists" [value]="playlist.id"><b>{{playlist.name}}</b> - <small><i>{{playlist.description}}</i></small></mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <mat-select placeholder="Bottom Banner Playlist" [(ngModel)]="settingsEdit.bottom_banner_id" name="bottomBannerId">
              <mat-option *ngFor="let playlist of allPlaylists" [value]="playlist.id"><b>{{playlist.name}}</b> - <small><i>{{playlist.description}}</i></small></mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <mat-select placeholder="Default Event Playlist" [(ngModel)]="settingsEdit.def_event_id" name="defEventId">
              <mat-option *ngFor="let playlist of allPlaylists" [value]="playlist.id"><b>{{playlist.name}}</b> - <small><i>{{playlist.description}}</i></small></mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <input matInput type="number" name="zoomLevel" placeholder="Zoom Level (default 2)" [(ngModel)]="settingsEdit.zoom_level" />
          </mat-form-field>
          <div class="clearfix"></div>
          <label [class.col-md-2] class="control-label" for="facilities-facility-icon">Wayfinder Settings</label>
          <mat-form-field class="col-md-12">
            <input matInput type="number" name="routeSpeed" placeholder="Route Speed (default 0.5)" [(ngModel)]="settingsEdit.arrow_speed" />
          </mat-form-field>
          <!--<mat-form-field class="col-md-12">
    <input matInput type="number" name="routeWeight" placeholder="Route Weight" [(ngModel)]="settingsEdit.route_weight" />
  </mat-form-field>-->
          <mat-form-field class="col-md-12">
            <input matInput type="color" name="routeColor" placeholder="Route Color" [(ngModel)]="settingsEdit.line_color" />
          </mat-form-field>

          <div class="col-md-12">
            <label [class.col-md-2] class="control-label">Arrow image</label>
            <div class="col-md-12">
              <file-upload (onUploadFinished)="uploadFinishedArrow($event)" fileTypes="image/*"></file-upload>
            </div>
            <div *ngIf="settingsEdit.arrow_image" class="col-md-9" style="padding:10px; border: 1px dashed #808080;text-align:center">
              <img [src]="getFileImage(settingsEdit.arrow_image)" alt="icon" style="height:150px;" />
            </div>
          </div>

          <mat-form-field class="col-md-12">
            <input matInput type="color" name="arrowColor" placeholder="Arrow Color" [(ngModel)]="settingsEdit.arrow_color" />
          </mat-form-field>

          <mat-form-field class="col-md-12">
            <input matInput type="number" name="floorInterval" placeholder="Interval between floor (default 3 seconds)" [(ngModel)]="settingsEdit.floor_interval" />
          </mat-form-field>
          <div class="clearfix"></div>
          <label [class.col-md-2] class="control-label" for="facilities-facility-icon">Event Month Color Settings</label>
          <div class="clearfix"></div>
          <mat-form-field class="col-md-6">
            <input matInput type="color" name="jan" placeholder="January" [(ngModel)]="settingsEdit.jan" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput type="color" name="feb" placeholder="February" [(ngModel)]="settingsEdit.feb" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput type="color" name="mar" placeholder="March" [(ngModel)]="settingsEdit.mar" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput type="color" name="apr" placeholder="April" [(ngModel)]="settingsEdit.apr" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput type="color" name="may" placeholder="May" [(ngModel)]="settingsEdit.may" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput type="color" name="jun" placeholder="June" [(ngModel)]="settingsEdit.jun" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput type="color" name="jul" placeholder="July" [(ngModel)]="settingsEdit.jul" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput type="color" name="aug" placeholder="August" [(ngModel)]="settingsEdit.aug" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput type="color" name="sep" placeholder="September" [(ngModel)]="settingsEdit.sep" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput type="color" name="oct" placeholder="October" [(ngModel)]="settingsEdit.oct" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput type="color" name="nov" placeholder="November" [(ngModel)]="settingsEdit.nov" />
          </mat-form-field>
          <mat-form-field class="col-md-6">
            <input matInput type="color" name="dec" placeholder="December" [(ngModel)]="settingsEdit.dec" />
          </mat-form-field>
          <div class="clearfix"></div>
          <label [class.col-md-2] class="control-label" for="facilities-facility-icon">Directory List Header Settings</label>
          <mat-form-field class="col-md-12">
            <input matInput type="color" name="dir_color" placeholder="Bg Color" [(ngModel)]="settingsEdit.dir_color" />
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <mat-select name="dir_font_type2" placeholder="Font Type" [(ngModel)]="settingsEdit.dir_font_type2">
              <mat-option [style.font-family]="f" *ngFor="let f of fonts" [value]="f">
                {{f}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <input matInput type="number" name="dir_font_size" placeholder="Font Size" [(ngModel)]="settingsEdit.dir_font_size" />
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <input matInput type="color" name="dir_font_color" placeholder="Font Color" [(ngModel)]="settingsEdit.dir_font_color" />
          </mat-form-field>
          <div class="clearfix"></div>
          <label [class.col-md-2] class="control-label" for="facilities-facility-icon">You are Here Settings</label>
          <div class="form-group">
            <div class="col-md-12">
              <label [class.col-md-2] class="control-label" for="facilities-facility-icon">Balloon image</label>
              <div class="col-md-12">
                <file-upload (onUploadFinished)="uploadFinishedBalloon($event)" fileTypes="image/*"></file-upload>
              </div>
              <div *ngIf="settingsEdit.baloon_image" class="col-md-9" style="padding:10px; border: 1px dashed #808080;text-align:center">
                <img [src]="getFileImage(settingsEdit.baloon_image)" alt="icon" style="height:150px;" />
              </div>
            </div>
          </div>
          <mat-form-field class="col-md-12">
            <input matInput type="number" name="baloon_width" placeholder="Width" [(ngModel)]="settingsEdit.baloon_width" />
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <input matInput type="number" name="baloon_height" placeholder="Height" [(ngModel)]="settingsEdit.baloon_height" />
          </mat-form-field>
          <!--<mat-form-field class="col-md-12">
    <input matInput type="number" name="anchor_h" placeholder="Anchor Horizontal" [(ngModel)]="settingsEdit.anchor_h" />
  </mat-form-field>
  <mat-form-field class="col-md-12">
    <input matInput type="number" name="anchor_v" placeholder="Anchor Vertical" [(ngModel)]="settingsEdit.anchor_v" />
  </mat-form-field>-->
          <!--<mat-form-field class="col-md-12">
    <input matInput [disabled]="!canManageFacilities" type="text" id="link" name="link" placeholder="External Link" [(ngModel)]="facilityEdit.link" #link="ngModel" />
  </mat-form-field>-->
        </div>
      </div>

      <div *ngIf="canManageKioskSettings" class="row">
        <div class="col-md-12">
          <hr [class.edit-separator-hr] />
        </div>
      </div>

      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageKioskSettings" type="button" mat-button (click)="cancel()">{{'facilities.editor.Close' | translate}}</button>
      <button *ngIf="canManageKioskSettings" type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'facilities.editor.Cancel' | translate}}</button>
      <button *ngIf="canManageKioskSettings" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('facilities.editor.Saving' | translate) : ('facilities.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
