<div>
  <header class="pageHeader">
    <h3>User Accounts</h3>
  </header>
  <div class="row control-box">
    <div class="col-xs-12 col-sm-4">
      <div class="form-group search-box">
        <search-box #searchbox (searchChange)="onSearchChanged($event)" (onEnter)="onSearch()" placeholder="User Name / Designation"></search-box>
      </div>
    </div>

    <mat-form-field class="col-xs-12 col-sm-4 col-md-2">
      <mat-select name="department" [(ngModel)]="reportFilter.departmentId" placeholder="Department">
        <mat-option *ngFor="let t of departments" [value]="t.id">
          {{t.name}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field class="col-xs-12 col-sm-4 col-md-2">
      <mat-select name="userGroup" [(ngModel)]="reportFilter.userGroupId" placeholder="User Group">
        <mat-option *ngFor="let t of userGroups" [value]="t.id">
          {{t.name}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field class="col-xs-12 col-sm-4 col-md-2">
      <input matInput [matDatepicker]="createdstartpicker" placeholder="Created From" [(ngModel)]="reportFilter.createdStart"
             (dateChange)="onChangeDate('createdstart', $event)">
      <mat-datepicker-toggle matSuffix [for]="createdstartpicker"></mat-datepicker-toggle>
      <mat-datepicker #createdstartpicker></mat-datepicker>
    </mat-form-field>
    <mat-form-field class="col-xs-12 col-sm-4 col-md-2">
      <input matInput [matDatepicker]="createdendpicker" placeholder="Created To" [(ngModel)]="reportFilter.createdEnd"
             (dateChange)="onChangeDate('createdend',$event)">
      <mat-datepicker-toggle matSuffix [for]="createdendpicker"></mat-datepicker-toggle>
      <mat-datepicker #createdendpicker></mat-datepicker>
    </mat-form-field>
    <mat-form-field class="col-xs-12 col-sm-4 col-md-2">
      <input matInput [matDatepicker]="loginstartpicker" placeholder="Last Login From" [(ngModel)]="reportFilter.lastLoginStart"
             (dateChange)="onChangeDate('loginstart', $event)">
      <mat-datepicker-toggle matSuffix [for]="loginstartpicker"></mat-datepicker-toggle>
      <mat-datepicker #loginstartpicker></mat-datepicker>
    </mat-form-field>
    <mat-form-field class="col-xs-12 col-sm-4 col-md-2">
      <input matInput [matDatepicker]="loginendpicker" placeholder="Last Login To" [(ngModel)]="reportFilter.lastLoginEnd"
             (dateChange)="onChangeDate('loginend',$event)">
      <mat-datepicker-toggle matSuffix [for]="loginendpicker"></mat-datepicker-toggle>
      <mat-datepicker #loginendpicker></mat-datepicker>
    </mat-form-field>
    <mat-form-field class="col-xs-12 col-sm-4 col-md-2">
      <input matInput [matDatepicker]="deleteddatepicker" placeholder="Deactivated On" [(ngModel)]="reportFilter.deletedDate"
             (dateChange)="onChangeDate('deleteddate',$event)">
      <mat-datepicker-toggle matSuffix [for]="deleteddatepicker"></mat-datepicker-toggle>
      <mat-datepicker #deleteddatepicker></mat-datepicker>
    </mat-form-field>
    <mat-form-field class="col-xs-12 col-sm-4 col-md-2">
      <mat-select name="status" [(ngModel)]="reportFilter.status" placeholder="Account Status">
        <mat-option [value]="true">Enabled</mat-option>
        <mat-option [value]="false">Deactivated</mat-option>
      </mat-select>
    </mat-form-field>
    <div class="col-xs-12 col-sm-12 col-md-4" style="padding-bottom:10px;">
      <button type="button" class="btn btn-sm" (click)="clearFilters();">Clear</button>
      <button type="button" class="btn btn-sm btn-info" (click)="loadData();">Filter</button>
      <button type="button" class="btn btn-sm btn-info" (click)="downloadResults();" style="margin-left:5px;">Download Results</button>
    </div>
  </div>

  <div class="table-responsive" *ngIf="pagedResult">
    <ngx-datatable class="material colored-header" #userReportTable
                   [loadingIndicator]="loadingIndicator"
                   [rows]="rows"
                   [rowHeight]="'auto'"
                   [headerHeight]="'auto'"
                   [footerHeight]="35"
                   [columns]="columns"
                   [columnMode]="'force'"
                   [externalPaging]="true"
                   [externalSorting]="true"
                   [count]="pagedResult.totalCount"
                   [limit]="pagedResult.filter.pageSize"
                   (page)="loadData($event)"
                   (sort)="loadData($event)">
    </ngx-datatable>
  </div>
  <ng-template #indexTemplate let-value="value" let-rowCount="rowCount" let-pageSize="pageSize" let-curPage="curPage" let-offset="offset">
    <strong>{{value}}</strong>
  </ng-template>
</div>
