<div>
  <header class="pageHeader">
    <h3>User Groups</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-8">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'userGroups.management.Search' | translate}}"></search-box>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="navbar action-box">
        <ul class="nav navbar-nav navbar-right">
          <li *ngIf="canManageUserGroups" class="toolbaritem">
            <a href="javascript:;" (click)="newUserGroup(row)">
              <i class="fa fa-plus-circle"></i> {{'userGroups.management.NewUserGroup' | translate}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ngx-datatable class="material colored-header"
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [externalPaging]="true"
                 [externalSorting]="true"
                 [count]="pagedResult.totalCount"
                 [limit]="pagedResult.filter.pageSize"
                 (page)="loadData($event)"
                 (sort)="loadData($event)">
  </ngx-datatable>

  <ng-template #indexTemplate let-value="value" let-rowCount="rowCount" let-pageSize="pageSize" let-curPage="curPage" let-offset="offset">
    <strong>{{value}}</strong>
  </ng-template>


  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageUserGroups" class="btn btn-link btn-xs" href="javascript:;" (click)="editUserGroup(row)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'userGroups.management.Edit' | translate}}</a>
    <a *ngIf="!canManageUserGroups" class="btn btn-link btn-xs" href="javascript:;" (click)="editUserGroup(row)"><i class="fa fa-eye" aria-hidden="true"></i> {{'userGroups.management.Details' | translate}}</a>
    <!--{{canManageUserGroups ? '|' : ''}}-->
    <a *ngIf="canManageUserGroups" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteUserGroup(row)"><i class="fa fa-trash-o" aria-hidden="true"></i> {{'userGroups.management.Delete' | translate}}</a>
  </ng-template>
</div>
