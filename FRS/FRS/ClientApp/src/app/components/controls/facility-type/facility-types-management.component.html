<div>
  <header class="pageHeader">
    <h3>Facility Types</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-8">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'facilityTypes.management.Search' | translate}}">></search-box>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="navbar action-box">
        <ul class="nav navbar-nav navbar-right">
          <li *ngIf="canManageFacilityTypes" class="toolbaritem">
            <a href="javascript:;" (click)="newFacilityType(row)">
              <i class="fa fa-plus-circle"></i> {{'facilityTypes.management.NewFacilityType' | translate}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ngx-datatable class="material colored-header"
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="35"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [limit]="20">
  </ngx-datatable>

  <ng-template #indexTemplate let-value="value">
    <strong>{{value}}</strong>
  </ng-template>


  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageFacilityTypes" class="btn btn-link btn-xs" href="javascript:;" (click)="editFacilityType(row)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'facilityTypes.management.Edit' | translate}}</a>
    <a *ngIf="!canManageFacilityTypes" class="btn btn-link btn-xs" href="javascript:;" (click)="editFacilityType(row)"><i class="fa fa-eye" aria-hidden="true"></i> {{'facilityTypes.management.Details' | translate}}</a>
    {{canManageFacilityTypes ? '|' : ''}}
    <a *ngIf="canManageFacilityTypes" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteFacilityType(row)"><i class="fa fa-trash-o" aria-hidden="true"></i> {{'facilityTypes.management.Delete' | translate}}</a>
  </ng-template>
  <facility-type-editor #facilityTypeEditor [hidden]="true"></facility-type-editor>

  <!--<div class="modal fade" bsModal #editorModal="bs-modal" (onHidden)="onEditorModalHidden()" [config]="{backdrop: 'static'}" tabindex="-1">
    <div class="modal-dialog modal-md">
      <div class="modal-content">
        <div class="modal-header">
          <h4 *ngIf="!canManageFacilityTypes" class="modal-title pull-left"><i class="fa fa-shield"></i> {{'facilityTypes.management.FacilityTypeDetails' | translate:editingFacilityTypeName}}</h4>
          <h4 *ngIf="canManageFacilityTypes" class="modal-title pull-left"><i class="fa fa-shield"></i> {{editingFacilityTypeName ? ('facilityTypes.management.EditFacilityType' | translate:editingFacilityTypeName) : ('facilityTypes.management.NewFacilityType' | translate)}}</h4>
          <button type="button" class="close pull-right" title="Close" (click)="editorModal.hide()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <facility-type-editor #facilityTypeEditor></facility-type-editor>
        </div>
      </div>
    </div>
  </div>-->
</div>
