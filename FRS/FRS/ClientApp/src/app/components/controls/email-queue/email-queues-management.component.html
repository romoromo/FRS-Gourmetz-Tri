<div>
  <header class="pageHeader">
    <h3>Email Queues</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-8">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'common.Search' | translate}}"></search-box>
      </div>
    </div>
  </div>

  <ngx-datatable class="material colored-header"
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [externalPaging]="true"
                 [externalSorting]="true"
                 [count]="pagedResult.totalCount"
                 [offset]="pagedResult.filter.pageNumber"
                 [limit]="pagedResult.filter.pageSize"
                 (page)="loadData($event)"
                 (sort)="loadData($event)">
  </ngx-datatable>

  <!--<ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageEmailQueues" class="btn btn-link btn-xs" href="javascript:;" (click)="editEmailQueue(row)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'common.RowAction.Edit' | translate}}</a>
    <a *ngIf="!canManageEmailQueues" class="btn btn-link btn-xs" href="javascript:;" (click)="editEmailQueue(row)"><i class="fa fa-eye" aria-hidden="true"></i> {{'common.RowAction.Details' | translate}}</a>
    <a *ngIf="canManageEmailQueues" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteEmailQueue(row)"><i class="fa fa-trash-o" aria-hidden="true"></i> {{'common.RowAction.Delete' | translate}}</a>
  </ng-template>-->
</div>
