<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="departmentEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!departmentName.valid && showErrorAlert('Department name is required', 'Please enter a department name (minimum of 2 and maximum of 200 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-md-12">
            <input matInput autocomplete="off" [disabled]="!canManageDepartments" type="text" id="departmentName" name="departmentName" placeholder="Enter department name" [(ngModel)]="departmentEdit.name" #departmentName="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>

          <mat-form-field class="col-md-12">
            <input matInput autocomplete="off" [disabled]="!canManageDepartments" type="text" id="departmentDescription" name="departmentDescription" placeholder="Enter department description" [(ngModel)]="departmentEdit.description" #departmentDescription="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>
        </div>
      </div>

      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageDepartments" type="button" mat-button (click)="cancel()" >{{'departments.editor.Close' | translate}}</button>
      <button *ngIf="canManageDepartments" type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'departments.editor.Cancel' | translate}}</button>
      <button *ngIf="canManageDepartments" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('departments.editor.Saving' | translate) : ('departments.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
