<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="emsEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!emsName.valid && showErrorAlert('Ems name is required', 'Please enter a ems name (minimum of 2 and maximum of 200 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-md-12">
            <input matInput [disabled]="!canManageEmses" type="text" id="emsName" name="emsName" autocomplete="off" placeholder="Enter ems name" [(ngModel)]="emsEdit.name" #emsName="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>

          <mat-form-field class="col-md-12">
            <input matInput [disabled]="!canManageEmses" type="text" id="emsDescription" name="emsDescription" autocomplete="off" placeholder="Enter ems description" [(ngModel)]="emsEdit.description" #emsDescription="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>
        </div>
      </div>
      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageEmses" type="button" mat-button (click)="cancel()" >{{'emses.editor.Close' | translate}}</button>
      <button *ngIf="canManageEmses" type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'common.editor.Cancel' | translate}}</button>
      <button *ngIf="canManageEmses" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('common.editor.Saving' | translate) : ('emses.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
