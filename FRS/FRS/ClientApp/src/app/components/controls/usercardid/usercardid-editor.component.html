<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form class="form-horizontal" name="userCardIdEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!cardId.valid && showErrorAlert('Card Id is required', 'Please enter a card id (minimum of 2 and maximum of 200 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-xs-12">
            <input matInput type="text" id="cardId" name="cardId" autocomplete="off" placeholder="Enter Card Id" [(ngModel)]="userCardIdEdit.cardId" #cardId="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>
          <mat-form-field class="col-xs-12">
            <input matInput type="text" id="remarks" name="remarks" autocomplete="off" placeholder="Enter Remarks" [(ngModel)]="userCardIdEdit.remarks" #remarks="ngModel" minlength="2" maxlength="200" />
          </mat-form-field>
          <mat-form-field class="col-md-12" *ngIf="!isUserInfo">
            <mat-select required name="userId" placeholder="{{'userCardIds.editor.Owner' | translate}}" [(ngModel)]="userCardIdEdit.userId">
              <mat-option *ngFor="let user of allUsers" [value]="user.id" required>{{user.fullName}}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>

      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'contactGroups.editor.Cancel' | translate}}</button>
      <button type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('contactGroups.editor.Saving' | translate) : ('contactGroups.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
