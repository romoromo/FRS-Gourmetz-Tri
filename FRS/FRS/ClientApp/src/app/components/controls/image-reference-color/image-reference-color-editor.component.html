<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="imageReferenceColorEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!imageReferenceColorName.valid && showErrorAlert('Name is required', 'Please enter name (minimum of 2 and maximum of 200 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-md-12">
            <input matInput autocomplete="off" [disabled]="!canManageImageReferenceColors" color="text" id="imageReferenceColorName" name="imageReferenceColorName" placeholder="Enter name" [(ngModel)]="imageReferenceColorEdit.name" #imageReferenceColorName="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>

          <mat-form-field class="col-md-12">
            <input matInput name="colorCode" [disabled]="!canManageImageReferenceColors" [(colorPicker)]="imageReferenceColorEdit.colorCode" [style.background]="imageReferenceColorEdit.colorCode" placeholder="Colour"/>
            <!--<input matInput autocomplete="off" [disabled]="!canManageImageReferenceColors" color="text" id="imageReferenceColorCode" name="imageReferenceColorCode" placeholder="Enter color" [(ngModel)]="imageReferenceColorEdit.colorCode" #imageReferenceColorCode="ngModel" required minlength="2" maxlength="200" />-->
          </mat-form-field>
        </div>
      </div>

      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageImageReferenceColors" type="button" mat-button (click)="cancel()" >{{'common.editor.Close' | translate}}</button>
      <button *ngIf="canManageImageReferenceColors" type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'common.editor.Cancel' | translate}}</button>
      <button *ngIf="canManageImageReferenceColors" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('common.editor.Saving' | translate) : ('common.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
