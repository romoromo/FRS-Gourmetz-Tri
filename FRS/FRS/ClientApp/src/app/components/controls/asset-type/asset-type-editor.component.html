<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="assetTypeEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!assetTypeName.valid && showErrorAlert('Name is required', 'Please enter name (minimum of 2 and maximum of 200 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-md-12">
            <input matInput autocomplete="off" [disabled]="!canManageAssetTypes" type="text" id="assetTypeName" name="assetTypeName" placeholder="Enter name" [(ngModel)]="assetTypeEdit.name" #assetTypeName="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>
        </div>
        <div class="col-sm-12">
          <label [class.col-md-3]="isViewOnly" [class.col-md-2]="!isViewOnly" class="control-label" for="locations-location-icon">Icon</label>
          <div class="col-md-5">
            <file-upload showTxt="false" (onUploadFinished)="uploadFinished($event)" fileTypes="image/*"></file-upload>
          </div>

          <div *ngIf="assetTypeEdit.filePath" class="col-md-4" style="padding:10px; border: 1px dashed #808080;text-align:center">
            <img [src]="getFileImage(assetTypeEdit.filePath)" alt="icon" style="width:50px; height:50px;" />
          </div>
        </div>
        
      </div>

      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageAssetTypes" type="button" mat-button (click)="cancel()" >{{'common.editor.Close' | translate}}</button>
      <button *ngIf="canManageAssetTypes" type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'common.editor.Cancel' | translate}}</button>
      <button *ngIf="canManageAssetTypes" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('common.editor.Saving' | translate) : ('common.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
