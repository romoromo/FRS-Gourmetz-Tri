<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="contactGroupMemberEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!contactGroupMemberName.valid && showErrorAlert('Member name is required', 'Please enter a contactGroupMemberMember name (minimum of 2 and maximum of 200 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-xs-12">
            <input matInput type="text" id="contactGroupMemberName" name="contactGroupMemberName" placeholder="Enter name" [(ngModel)]="contactGroupMemberEdit.name" #contactGroupMemberName="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>

          <mat-form-field class="col-xs-12">
            <input matInput type="text" id="contactGroupMemberEmail" name="contactGroupMemberEmail" placeholder="Enter email" [(ngModel)]="contactGroupMemberEdit.email" #contactGroupMemberEmail="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>

          <mat-form-field class="col-xs-12">
            <input matInput type="text" id="contactGroupMemberDepartment" name="contactGroupMemberDepartment" placeholder="Department" [(ngModel)]="contactGroupMemberEdit.department" #contactGroupMemberDepartment="ngModel" />
          </mat-form-field>

          <mat-form-field class="col-xs-12">
            <input matInput type="text" id="contactGroupMemberDesignation" name="contactGroupMemberDesignation" placeholder="Designation" [(ngModel)]="contactGroupMemberEdit.designation" #contactGroupMemberDesignation="ngModel" />
          </mat-form-field>
          <mat-form-field class="col-xs-12">
            <input matInput type="text" id="contactGroupMemberPhoneNumber" name="contactGroupMemberPhoneNumber" placeholder="Phone Number" [(ngModel)]="contactGroupMemberEdit.phoneNumber" #contactGroupMemberPhoneNumber="ngModel" />
          </mat-form-field>
          <mat-form-field class="col-xs-12">
            <input matInput type="text" id="contactGroupMemberHomeNo" name="contactGroupMemberHomeNo" placeholder="Home Number" [(ngModel)]="contactGroupMemberEdit.homeNo" #contactGroupMemberHomeNo="ngModel" />
          </mat-form-field>
          <mat-form-field class="col-xs-12">
            <input matInput type="text" id="contactGroupMemberMobileNo" name="contactGroupMemberMobileNo" placeholder="Mobile Number" [(ngModel)]="contactGroupMemberEdit.mobileNo" #contactGroupMemberMobileNo="ngModel" />
          </mat-form-field>
          <mat-form-field class="col-xs-12">
            <input matInput type="text" id="contactGroupMemberCompany" name="contactGroupMemberCompany" placeholder="Company" [(ngModel)]="contactGroupMemberEdit.company" #contactGroupMemberCompany="ngModel" />
          </mat-form-field>
        </div>
      </div>

      <div class="clearfix"></div>
    </div>
    <div mat-dialog-actions align="center">
      <!--<button *ngIf="!canManageContactGroups" type="button" mat-button (click)="cancel()">{{'contactGroupMembers.editor.Close' | translate}}</button>-->
      <button type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'contactGroups.editor.Cancel' | translate}}</button>
      <button type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('contactGroups.editor.Saving' | translate) : ('contactGroups.editor.Save' | translate)}}
      </button>
    </div>
  </form>
</div>
