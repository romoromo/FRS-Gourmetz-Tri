<h1 mat-dialog-title>{{data.header}}</h1>
<div>
  <form *ngIf="formResetToggle" class="form-horizontal" name="facilityEditorForm" #f="ngForm" novalidate
        (ngSubmit)="f.form.valid ? save() :
          (!facilityName.valid && showErrorAlert('Equipment name is required', 'Please enter a equipment name (minimum of 2 and maximum of 200 characters)'));">
    <div mat-dialog-content>
      <div class="row">
        <div class="col-sm-12">
          <mat-form-field class="col-md-12">
            <input matInput [disabled]="!canManageFacilities" type="text" id="facilityName" name="facilityName" placeholder="Enter name" [(ngModel)]="facilityEdit.name" #facilityName="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>
          <mat-form-field class="col-md-12">
            <input matInput [disabled]="!canManageFacilities" type="text" id="facilityDescription" name="facilityDescription" placeholder="Enter description" [(ngModel)]="facilityEdit.description" #facilityDescription="ngModel" required minlength="2" maxlength="200" />
          </mat-form-field>

            </mat-select>
          </mat-form-field>-->
          <mat-form-field class="col-md-12">
            <input matInput [disabled]="!canManageFacilities" type="text" id="link" name="link" placeholder="External Link" [(ngModel)]="facilityEdit.link" #link="ngModel"/>
          </mat-form-field>

                {{'facilities.editor.FacilityNameRequired' | translate}}
              </span>
            </div>
          </div>-->

        <div class="col-md-12">
          <hr [class.separator-hr]="!isEditMode" [class.edit-separator-hr]="isEditMode" />
        </div>
      </div>

      <div *ngIf="!isEditMode || canManageFacilities" class="row">
        <label [class.col-md-3]="isViewOnly" [class.col-md-2]="!isViewOnly" class="control-label" for="facilities-facility-icon">Icon</label>
        <div class="col-md-7">
          <file-upload (onUploadFinished)="uploadFinished($event)"></file-upload>
        </div>

        <div *ngIf="facilityEdit.filePath" class="col-md-2" style="padding:10px; border: 1px dashed #808080;text-align:center">
          <img [src]="getFileImage(facilityEdit.filePath)" alt="icon" style="width:50px; height:50px;" />

    <div mat-dialog-actions align="center">
      <button *ngIf="!canManageFacilities" type="button" mat-button (click)="cancel()">{{'facilities.editor.Close' | translate}}</button>
      <button *ngIf="canManageFacilities" type="button" mat-button (click)="cancel()" [disabled]="isSaving"><i class='fa fa-times'></i> {{'facilities.editor.Cancel' | translate}}</button>
      <button *ngIf="canManageFacilities" type="submit" mat-button [disabled]="isSaving">
        <i *ngIf="!isSaving" class='fa fa-save'></i><i *ngIf="isSaving" class='fa fa-circle-o-notch fa-spin'></i> {{isSaving ? ('facilities.editor.Saving' | translate) : ('facilities.editor.Save' | translate)}}
