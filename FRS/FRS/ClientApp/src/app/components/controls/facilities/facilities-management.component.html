<div>
  <header class="pageHeader">
    <h3>Equipments</h3>
  </header>
  <div class="row control-box">
    <div class="col-sm-8">
      <div class="form-group search-box">
        <search-box (searchChange)="onSearchChanged($event)" placeholder="{{'facilities.management.Search' | translate}}">></search-box>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="navbar action-box">
        <ul class="nav navbar-nav navbar-right">
          <li *ngIf="canManageFacilities" class="toolbaritem">
            <a href="javascript:;" (click)="newFacility(row)">
              <i class="fa fa-plus-circle"></i> {{'facilities.management.NewFacility' | translate}}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ngx-datatable class="material colored-header"
                 [loadingIndicator]="loadingIndicator"
                 [rows]="rows"
                 [rowHeight]="'auto'"
                 [headerHeight]="'auto'"
                 [footerHeight]="35"
                 [columns]="columns"
                 [columnMode]="'force'"
                 [limit]="20">
  </ngx-datatable>

  <ng-template #indexTemplate let-value="value">
    <strong>{{value}}</strong>
  </ng-template>


  <ng-template #actionsTemplate let-row="row" let-value="value" let-i="index">
    <a *ngIf="canManageFacilities" class="btn btn-link btn-xs" href="javascript:;" (click)="editFacility(row)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> {{'facilities.management.Edit' | translate}}</a>
    <a *ngIf="!canManageFacilities" class="btn btn-link btn-xs" href="javascript:;" (click)="editFacility(row)"><i class="fa fa-eye" aria-hidden="true"></i> {{'facilities.management.Details' | translate}}</a>
    {{canManageFacilities ? '|' : ''}}
    <a *ngIf="canManageFacilities" class="btn btn-link btn-xs" href="javascript:;" (click)="deleteFacility(row)"><i class="fa fa-trash-o" aria-hidden="true"></i> {{'facilities.management.Delete' | translate}}</a>
  </ng-template>
  <facility-editor #facilityEditor [hidden]="true"></facility-editor>

  <!--<div class="modal fade" bsModal #editorModal="bs-modal" (onHidden)="onEditorModalHidden()" [config]="{backdrop: 'static'}" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h4 *ngIf="!canManageFacilities" class="modal-title pull-left"><i class="fa fa-shield"></i> {{'facilities.management.FacilityDetails' | translate:editingFacilityName}}</h4>
          <h4 *ngIf="canManageFacilities" class="modal-title pull-left"><i class="fa fa-shield"></i> {{editingFacilityName ? ('facilities.management.EditFacility' | translate:editingFacilityName) : ('facilities.management.NewFacility' | translate)}}</h4>
          <button type="button" class="close pull-right" title="Close" (click)="editorModal.hide()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <facility-editor #facilityEditor></facility-editor>
        </div>
      </div>
    </div>
  </div>-->
</div>
